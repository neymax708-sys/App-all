<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Docs AI</title>

<link rel="icon" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:linear-gradient(-45deg,#050510,#120f2f,#1f145c,#5b4bff);
background-size:400% 400%;
animation:bg 12s ease infinite;
color:white;
padding:12px;
min-height:100vh;
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
max-width:760px;
margin:auto;
}

.hidden{
display:none !important;
}

.hero{
text-align:center;
padding:30px 15px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
backdrop-filter:blur(14px);
margin-bottom:20px;
}

.logo-app{
width:110px;
height:110px;
border-radius:28px;
margin-bottom:15px;
box-shadow:0 0 35px rgba(91,75,255,.5);
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.08);
padding:24px 10px;
border-radius:28px;
display:flex;
flex-direction:column;
align-items:center;
cursor:pointer;
transition:.3s;
backdrop-filter:blur(14px);
}

.card:hover{
transform:translateY(-6px);
}

.card i{
font-size:34px;
margin-bottom:12px;
}

.card span{
font-size:13px;
font-weight:800;
}

.screen{
margin-top:15px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:20px;
border-radius:28px;
}

.input,.textarea{
width:100%;
padding:16px;
margin-bottom:14px;
border-radius:18px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.06);
color:white;
outline:none;
font-size:14px;
}

.textarea{
min-height:140px;
resize:none;
}

.generate-btn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#5b4bff,#7c6cff);
color:white;
font-weight:800;
cursor:pointer;
margin-top:5px;
}

.back-btn{
background:none;
border:none;
color:#c2bcff;
font-size:15px;
font-weight:bold;
margin-bottom:15px;
cursor:pointer;
}

.login-box{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.login-btn{
padding:16px 24px;
border:none;
border-radius:16px;
background:white;
color:#111;
font-weight:800;
cursor:pointer;
font-size:15px;
}

.user-info-bar{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:15px;
}

.user-info-bar img{
width:55px;
height:55px;
border-radius:50%;
border:3px solid #5b4bff;
object-fit:cover;
}

.dashboard{
padding:22px;
border-radius:28px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
margin-bottom:20px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

<div class="login-box">

<img src="logo.png" style="width:120px;margin-bottom:20px;">

<h1 style="margin-bottom:10px;">
Elite Docs AI
</h1>

<p style="margin-bottom:30px;color:#aaa;">
Entre com sua conta Google
</p>

<button onclick="fazerLogin()" class="login-btn">
<i class="fab fa-google"></i>
Entrar com Google
</button>

</div>
</div>

<!-- APP -->

<div class="container" id="appScreen" style="display:none;">

<div class="hero">

<img src="logo.png" class="logo-app">

<h1>Elite Docs AI</h1>

<div class="user-info-bar">

<img id="userPhoto">

<div>

<div id="userName" style="font-weight:700;"></div>

<button onclick="sairConta()" style="background:none;border:none;color:#ff4d4d;cursor:pointer;font-size:13px;font-weight:bold;">
Sair
</button>

</div>
</div>
</div>

<div class="dashboard">

<h2>Dashboard Premium</h2>

<p style="color:#aaa;margin-top:5px;">
Gerador inteligente de documentos com IA.
</p>

</div>

<!-- MENU -->

<div class="grid" id="mainGrid">

<div class="card" onclick="abrirTela('curriculoScreen')">
<i class="fas fa-user-tie" style="color:#7c6cff"></i>
<span>Currículo</span>
</div>

<div class="card" onclick="abrirTela('pdfScreen')">
<i class="fas fa-file-pdf" style="color:#ef4444"></i>
<span>PDF</span>
</div>

<div class="card" onclick="abrirTela('wordScreen')">
<i class="fas fa-file-word" style="color:#2b579a"></i>
<span>Word</span>
</div>

<div class="card" onclick="abrirTela('txtScreen')">
<i class="fas fa-file-lines" style="color:#aaa"></i>
<span>TXT</span>
</div>

<div class="card" onclick="abrirTela('linkedinScreen')">
<i class="fab fa-linkedin" style="color:#0a66c2"></i>
<span>LinkedIn IA</span>
</div>

</div>

<!-- CURRICULO -->

<div id="curriculoScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<h2 style="margin-bottom:20px;">
Currículo Profissional
</h2>

<input class="input" id="nome" placeholder="Nome completo">

<input class="input" id="cargo" placeholder="Cargo">

<input class="input" id="cidade" placeholder="Cidade">

<input class="input" id="whatsapp" placeholder="WhatsApp">

<input class="input" id="email" placeholder="E-mail">

<input class="input" type="file" id="fotoPerfil" accept="image/*">

<textarea class="textarea" id="resumo" placeholder="Resumo profissional"></textarea>

<textarea class="textarea" id="experiencia" placeholder="Experiência"></textarea>

<textarea class="textarea" id="habilidades" placeholder="Habilidades"></textarea>

<textarea class="textarea" id="formacao" placeholder="Formação"></textarea>

<button class="generate-btn" onclick="melhorarResumo()">
✨ Melhorar com IA
</button>

<button class="generate-btn" onclick="gerarCurriculoPDF()">
GERAR CURRÍCULO PDF
</button>

</div>

<!-- PDF -->

<div id="pdfScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<h2 style="margin-bottom:15px;">
Criador PDF
</h2>

<input class="input" id="pdfTitulo" placeholder="Título do PDF">

<textarea class="textarea" id="pdfTexto" placeholder="Digite o conteúdo do PDF"></textarea>

<button class="generate-btn" onclick="gerarPDFTexto()">
📄 GERAR PDF NORMAL
</button>

<div style="height:1px;background:rgba(255,255,255,.08);margin:30px 0;"></div>

<h2 style="margin-bottom:15px;">
PDF com Foto
</h2>

<input class="input" id="fotoTitulo" placeholder="Título do PDF com foto">

<input class="input" type="file" id="fotoPDF" accept="image/*">

<textarea class="textarea" id="fotoTexto" placeholder="Texto do PDF com foto"></textarea>

<button class="generate-btn" onclick="gerarPDFFoto()">
🖼️ GERAR PDF COM FOTO
</button>

</div>

<!-- WORD -->

<div id="wordScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<h2 style="margin-bottom:15px;">
Arquivo Word
</h2>

<input class="input" id="wordTitulo" placeholder="Nome do arquivo">

<textarea class="textarea" id="wordTexto" placeholder="Digite o texto"></textarea>

<button class="generate-btn" onclick="baixarWord()">
BAIXAR DOC
</button>

</div>

<!-- TXT -->

<div id="txtScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<h2 style="margin-bottom:15px;">
Arquivo TXT
</h2>

<textarea class="textarea" id="txtTexto" placeholder="Digite qualquer texto"></textarea>

<button class="generate-btn" onclick="baixarTXT()">
BAIXAR TXT
</button>

</div>

<!-- LINKEDIN -->

<div id="linkedinScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<h2 style="margin-bottom:15px;">
LinkedIn IA
</h2>

<textarea class="textarea" id="linkedinTexto" placeholder="Fale sobre você"></textarea>

<button class="generate-btn" onclick="gerarLinkedin()">
GERAR TEXTO
</button>

</div>

</div>

<script>

function abrirTela(id){

document.getElementById('mainGrid').classList.add('hidden');

document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));

document.getElementById(id).classList.remove('hidden');

}

function voltar(){

document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));

document.getElementById('mainGrid').classList.remove('hidden');

}

async function melhorarResumo(){

const campo=document.getElementById('resumo');

const original=campo.value;

campo.value='IA melhorando...';

try{

const r=await fetch(
'https://text.pollinations.ai/openai/' +
encodeURIComponent(
'Melhore esse resumo profissional: ' + original
)
);

campo.value=await r.text();

}catch(e){

campo.value=original;

alert('Erro IA');

}

}

function gerarCurriculoPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

const nome=document.getElementById('nome').value;
const cargo=document.getElementById('cargo').value;
const resumo=document.getElementById('resumo').value;

doc.setFillColor(91,75,255);
doc.rect(0,0,60,297,'F');

doc.setTextColor(255,255,255);
doc.setFontSize(22);
doc.text(nome.toUpperCase(),10,30);

doc.setFontSize(12);
doc.text(cargo,10,42);

doc.setTextColor(0,0,0);

doc.setFontSize(16);
doc.text('Resumo',70,25);

doc.setFontSize(11);

doc.text(
doc.splitTextToSize(resumo,120),
70,
35
);

doc.save('curriculo_elite.pdf');

}

function gerarPDFTexto(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

doc.setFontSize(20);

doc.text(
document.getElementById('pdfTitulo').value,
20,
20
);

doc.setFontSize(12);

doc.text(
doc.splitTextToSize(
document.getElementById('pdfTexto').value,
170
),
20,
40
);

doc.save('arquivo.pdf');

}

function gerarPDFFoto(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

const foto=document.getElementById('fotoPDF').files[0];

if(!foto){

alert('Selecione uma foto');

return;

}

const reader=new FileReader();

reader.readAsDataURL(foto);

reader.onload=function(e){

doc.setFontSize(20);

doc.text(
document.getElementById('fotoTitulo').value,
20,
20
);

doc.addImage(
e.target.result,
'JPEG',
20,
35,
70,
70
);

doc.text(
doc.splitTextToSize(
document.getElementById('fotoTexto').value,
160
),
20,
120
);

doc.save('pdf_com_foto.pdf');

}

}

function baixarWord(){

const texto=document.getElementById('wordTexto').value;

const blob=new Blob([texto],{
type:'application/msword'
});

const link=document.createElement('a');

link.href=URL.createObjectURL(blob);

link.download='arquivo.doc';

link.click();

}

function baixarTXT(){

const texto=document.getElementById('txtTexto').value;

const blob=new Blob([texto],{
type:'text/plain'
});

const link=document.createElement('a');

link.href=URL.createObjectURL(blob);

link.download='arquivo.txt';

link.click();

}

async function gerarLinkedin(){

const campo=document.getElementById('linkedinTexto');

const original=campo.value;

campo.value='IA escrevendo...';

try{

const r=await fetch(
'https://text.pollinations.ai/openai/' +
encodeURIComponent(
'Crie um texto profissional para LinkedIn: ' + original
)
);

campo.value=await r.text();

}catch(e){

campo.value=original;

alert('Erro IA');

}

}

</script>

<script type="module">

import {
initializeApp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
getAuth,
GoogleAuthProvider,
signInWithRedirect,
getRedirectResult,
onAuthStateChanged,
signOut
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const firebaseConfig={

apiKey:'AIzaSyDFPrrCSowCUo3QJ6T280zja2Wqutlccvo',
authDomain:'elite-docsai.firebaseapp.com',
projectId:'elite-docsai',
storageBucket:'elite-docsai.firebasestorage.app',
messagingSenderId:'1048692395624',
appId:'1:1048692395624:web:74fb23e57580b9203ab5dd'

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const provider=new GoogleAuthProvider();

window.fazerLogin=async function(){

await signInWithRedirect(auth,provider);

}

getRedirectResult(auth)
.then((result)=>{

if(result?.user){

mostrarApp(result.user);

}

})
.catch((e)=>{

console.log(e);

});

function mostrarApp(user){

document.getElementById('loginScreen').style.display='none';

document.getElementById('appScreen').style.display='block';

document.getElementById('userName').innerText=user.displayName;

if(user.photoURL){

document.getElementById('userPhoto').src=user.photoURL;

}

}

onAuthStateChanged(auth,(user)=>{

if(user){

mostrarApp(user);

}else{

document.getElementById('loginScreen').style.display='block';

document.getElementById('appScreen').style.display='none';

}

});

window.sairConta=async function(){

await signOut(auth);

location.reload();

}

</script>

</body>
</html>
