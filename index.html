<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI | Professional System</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #5b4bff;
            --secondary: #00d2ff;
            --bg: #030308;
            --card: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body { background-color: var(--bg); color: var(--text-main); overflow-x: hidden; }

        .hidden { display: none !important; }

        /* --- ESTILO TELA DE LOGIN --- */
        #screen-login {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at top right, #1a1a3a, transparent);
        }

        .login-box {
            background: var(--card);
            padding: 40px 30px;
            border-radius: 32px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo-main {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 35px;
            box-shadow: 0 0 30px rgba(91, 75, 255, 0.4);
        }

        .btn-google {
            background: #fff;
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 30px;
        }

        .btn-google:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.1); }

        /* --- DASHBOARD COMPLETO --- */
        #screen-main { padding-bottom: 100px; }

        .navbar {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(3, 3, 8, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .profile-section { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 14px; border: 2px solid var(--primary); }

        .xp-container {
            padding: 20px;
            margin: 10px 20px;
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
        }

        .xp-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
        .xp-bar { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 45%; }

        /* --- BOTÕES DE AÇÃO --- */
        .grid-tools {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .tool-card {
            background: var(--card);
            padding: 25px 20px;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .tool-card:active { transform: scale(0.95); }
        .tool-card i { font-size: 32px; color: var(--primary); margin-bottom: 15px; display: block; }
        .tool-card h3 { font-size: 15px; font-weight: 700; }

        /* --- AREA DA IA --- */
        .ia-chat-box {
            margin: 20px;
            background: linear-gradient(145deg, rgba(91, 75, 255, 0.1), rgba(0, 210, 255, 0.05));
            border-radius: 28px;
            padding: 25px;
            border: 1px solid rgba(91, 75, 255, 0.2);
        }

        .ia-input-container {
            background: rgba(0,0,0,0.3);
            border-radius: 18px;
            padding: 5px;
            display: flex;
            margin-top: 15px;
        }

        .ia-input-container input {
            background: none;
            border: none;
            color: white;
            padding: 12px;
            flex: 1;
            outline: none;
        }

        .btn-send {
            background: var(--primary);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 14px;
            cursor: pointer;
        }

        /* --- FOOTER MENU --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 20, 0.95);
            padding: 20px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border);
            backdrop-filter: blur(15px);
        }

        .nav-item { color: var(--text-dim); font-size: 20px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }

    </style>
</head>
<body>

    <section id="screen-login">
        <div class="login-box">
            <div class="logo-main"><i class="fas fa-bolt"></i></div>
            <h1 style="font-size: 28px; font-weight: 800; letter-spacing: -1px;">Elite Docs AI</h1>
            <p style="color: var(--text-dim); margin-top: 10px; font-size: 14px;">O futuro da documentação profissional com IA</p>
            
            <button class="btn-google" onclick="loginGoogle()">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="22">
                Continuar com Google
            </button>
            <p style="font-size: 12px; color: var(--text-dim); margin-top: 25px;">Ao entrar você aceita nossos termos de uso.</p>
        </div>
    </section>

    <section id="screen-main" class="hidden">
        <nav class="navbar">
            <div class="profile-section">
                <img id="user-photo" class="avatar" src="" alt="User">
                <div>
                    <p style="font-size: 12px; color: var(--text-dim);">Bem-vindo,</p>
                    <h2 id="user-name" style="font-size: 18px; font-weight: 700;">Usuário</h2>
                </div>
            </div>
            <i class="fas fa-bell nav-item"></i>
        </nav>

        <div class="xp-container">
            <div class="xp-header">
                <span>Nível 12 (Pro)</span>
                <span style="color: var(--primary);">2.450 XP</span>
            </div>
            <div class="xp-bar">
                <div class="xp-fill"></div>
            </div>
        </div>

        <div class="ia-chat-box">
            <h3 style="font-size: 16px; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-robot"></i> Assistente Elite IA
            </h3>
            <p style="font-size: 13px; color: var(--text-dim); margin-top: 5px;">O que vamos criar profissionalmente hoje?</p>
            <div class="ia-input-container">
                <input type="text" placeholder="Ex: Crie um contrato de serviços...">
                <button class="btn-send"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div class="grid-tools">
            <div class="tool-card" onclick="openTool('pdf')">
                <i class="fas fa-file-pdf"></i>
                <h3>Gerador PDF</h3>
            </div>
            <div class="tool-card" onclick="openTool('cv')">
                <i class="fas fa-id-badge"></i>
                <h3>Currículo IA</h3>
            </div>
            <div class="tool-card" onclick="openTool('contract')">
                <i class="fas fa-file-contract"></i>
                <h3>Contratos</h3>
            </div>
            <div class="tool-card" onclick="openTool('ai')">
                <i class="fas fa-wand-magic-sparkles"></i>
                <h3>Doc Writer</h3>
            </div>
        </div>

        <div style="padding: 20px;">
            <button onclick="logout()" style="width:100%; padding:15px; background:none; border:1px solid #ff4b4b; color:#ff4b4b; border-radius:18px; font-weight:700;">
                Sair da Conta
            </button>
        </div>

        <div class="bottom-nav">
            <i class="fas fa-home nav-item active"></i>
            <i class="fas fa-search nav-item"></i>
            <i class="fas fa-folder nav-item"></i>
            <i class="fas fa-user nav-item"></i>
        </div>
    </section>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDFPrrCSowCuo3QJ6T280zja2Wqutlccvo",
            authDomain: "elite-docsai.firebaseapp.com",
            projectId: "elite-docsai",
            storageBucket: "elite-docsai.appspot.com",
            messagingSenderId: "1048692395624",
            appId: "1:1048692395624:web:74fb23e57580b9203ab5dd",
            measurementId: "G-G63HC1V4FD"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // --- LÓGICA DE LOGIN ---
        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            
            // Usando Redirect (Obrigatório para GitHub Pages no Celular)
            auth.signInWithRedirect(provider);
        }

        function logout() {
            auth.signOut();
        }

        // --- CONTROLE DE TELAS ---
        auth.onAuthStateChanged((user) => {
            const loginScreen = document.getElementById('screen-login');
            const mainScreen = document.getElementById('screen-main');
            
            if (user) {
                loginScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
                
                // Preencher dados do usuário
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/150';
                console.log("Usuário logado:", user.email);
            } else {
                loginScreen.classList.remove('hidden');
                mainScreen.classList.add('hidden');
            }
        });

        // Captura o resultado após o redirecionamento
        auth.getRedirectResult().catch((error) => {
            if(error.code) {
                alert("Erro ao autenticar: " + error.message);
                console.error(error);
            }
        });

        // Funções auxiliares
        function openTool(type) {
            alert("A ferramenta de " + type.toUpperCase() + " está sendo carregada com o motor de IA...");
        }
    </script>
</body>
</html>
