<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI | Login</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }

        /* TELA DE LOGIN (SÓ APARECE NO INÍCIO) */
        #login-screen { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; text-align: center; padding: 20px;
        }
        .login-box { background: var(--card); padding: 40px; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); max-width: 400px; width: 100%; }
        .logo-icon { font-size: 50px; color: var(--primary); margin-bottom: 20px; }

        /* APP PRINCIPAL (ESCONDIDO ATÉ LOGAR) */
        #main-app { display: none; padding: 20px; max-width: 550px; margin: 0 auto; }
        
        header { padding: 20px; text-align: center; }
        header h1 { font-size: 24px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }

        .card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); }
        label { display: block; font-size: 10px; font-weight: 800; color: #6366f1; text-transform: uppercase; margin-bottom: 8px; }
        input, textarea { width: 100%; background: rgba(15,23,42,0.8); border: 1px solid #334155; border-radius: 15px; color: white; padding: 15px; font-size: 16px; margin-bottom: 15px; outline: none; }
        
        .user-pill { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 50px; margin-bottom: 20px; font-size: 12px; }
        .user-pill img { width: 25px; height: 25px; border-radius: 50%; }

        .btn { width: 100%; padding: 18px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; font-size: 16px; }
        .btn-ai { background: var(--primary); color: white; }
        .btn-view { background: #10b981; color: white; }

        /* WORKSPACE */
        #workspace { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f1f5f9; z-index: 1000; display: none; overflow-y: auto; }
        .toolbar { background: #1e293b; padding: 15px; display: flex; justify-content: space-between; color: white; }
        .paper { background: white; width: 90%; max-width: 800px; margin: 30px auto; padding: 60px; color: #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <i class="fas fa-file-shield logo-icon"></i>
            <h2 style="margin-bottom: 10px;">Elite Docs AI</h2>
            <p style="color: #94a3b8; margin-bottom: 30px; font-size: 14px;">Transforme suas ideias em documentos profissionais com IA.</p>
            
            <div id="g_id_onload"
                 data-client_id="COLE_AQUI_SEU_CLIENT_ID_DO_GOOGLE_CLOUD"
                 data-callback="onSignIn"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue"></div>
            
            <p style="font-size: 11px; margin-top: 20px; color: #6366f1;">Acesse com sua conta Google para começar</p>
        </div>
    </div>

    <div id="main-app">
        <header><h1>Elite Docs AI</h1></header>
        
        <div id="userInfo" class="user-pill">
            <img id="uPic" src="" alt="">
            <span id="uName"></span>
        </div>

        <div class="card">
            <label>Título Executivo</label>
            <input type="text" id="docTitle" placeholder="Ex: Projeto de Vendas 2026">
            
            <label>Conteúdo para IA</label>
            <textarea id="textContent" placeholder="Escreva os pontos principais..."></textarea>

            <button class="btn btn-ai" onclick="processarComIA()">
                <i class="fas fa-wand-magic-sparkles"></i> Gerar Documento Elite
            </button>
            <button class="btn btn-view" onclick="verWorkspace()">
                <i class="fas fa-eye"></i> Visualizar e Exportar
            </button>
        </div>
    </div>

    <div id="workspace">
        <div class="toolbar">
            <button onclick="fecharWorkspace()" style="background:none; color:white; border:none; cursor:pointer;"><i class="fas fa-chevron-left"></i> Voltar</button>
            <div style="display:flex; gap:10px;">
                <button onclick="baixar('pdf')" style="padding:8px 12px; border-radius:8px; border:none; cursor:pointer;"><i class="fas fa-file-pdf"></i> PDF</button>
                <button onclick="baixar('xlsx')" style="padding:8px 12px; border-radius:8px; border:none; cursor:pointer;"><i class="fas fa-file-excel"></i> XLSX</button>
            </div>
        </div>
        <div class="paper" id="paper">
            <h2 id="wTitle" style="border-bottom: 2px solid #4f46e5; padding-bottom: 15px;"></h2>
            <p id="wBody" style="white-space: pre-line; line-height: 1.8;"></p>
        </div>
    </div>

    <script>
        // Lógica de Login
        function onSignIn(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            
            // Troca de Telas
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            
            // Info do Usuário
            document.getElementById('uPic').src = data.picture;
            document.getElementById('uName').innerText = data.name;
        }

        async function processarComIA() {
            const area = document.getElementById('textContent');
            if(!area.value) return;
            area.placeholder = "IA trabalhando...";
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Crie um documento profissional, formal e bem estruturado em português com este conteúdo: " + area.value)}`);
                area.value = await res.text();
            } catch (e) { alert("Erro ao conectar com IA"); }
        }

        function verWorkspace() {
            document.getElementById('wTitle').innerText = document.getElementById('docTitle').value || "Documento Sem Título";
            document.getElementById('wBody').innerText = document.getElementById('textContent').value;
            document.getElementById('workspace').style.display = 'block';
        }

        function fecharWorkspace() { document.getElementById('workspace').style.display = 'none'; }

        function baixar(tipo) {
            const nome = document.getElementById('docTitle').value || "Elite_Doc";
            if(tipo === 'pdf') {
                html2pdf().from(document.getElementById('paper')).save(nome + ".pdf");
            } else {
                const ws = XLSX.utils.aoa_to_sheet([[document.getElementById('textContent').value]]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Dados");
                XLSX.writeFile(wb, nome + ".xlsx");
            }
        }
    </script>
</body>
</html>
