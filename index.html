<!-- SUBSTITUA APENAS A FUNÇÃO iniciarIA() DO SEU APP POR ESTA -->

<script>

async function iniciarIA(){

const input = document.getElementById('rawInput').value;

if(!input){
alert('Digite informações sobre o profissional.');
return;
}

document.getElementById('processing').style.display='block';
document.getElementById('dashboard').style.display='none';

[1,2,3,4].forEach((i,index)=>{
setTimeout(()=>{
document.getElementById('s'+i).classList.add('active');
},index*900);
});

try{

const prompt = `
Você é um especialista premium em RH e ATS.

Crie um currículo profissional moderno e refinado.

RETORNE EXATAMENTE NESTE FORMATO:

[NOME]
|||
[RESUMO]
|||
[EXPERIÊNCIA]
|||
[FORMAÇÃO]
|||
[HABILIDADES separadas por vírgula]

Texto:
${input}
`;

const res = await fetch(
`https://text.pollinations.ai/${encodeURIComponent(prompt)}`
);

const text = await res.text();

const partes = text.split("|||");

const nome = partes[0] || "Profissional";
const resumo = partes[1] || "";
const experiencia = partes[2] || "";
const formacao = partes[3] || "";
const habilidades = partes[4] || "";

document.getElementById('dashboard').innerHTML = `

<div class="stats">

<div class="stat">
<h2>98%</h2>
<span>ATS Score</span>
</div>

<div class="stat">
<h2>Elite</h2>
<span>Nível</span>
</div>

<div class="stat">
<h2>${habilidades.split(',').length}</h2>
<span>Skills</span>
</div>

<div class="stat">
<h2>AI+</h2>
<span>Refinado</span>
</div>

</div>

<div class="content">

<h3>
<i class="fas fa-id-card"></i>
Nome Profissional
</h3>

<p>
${nome.replace(/\[|\]/g,'')}
</p>

</div>

<div class="content">

<h3>
<i class="fas fa-user-tie"></i>
Resumo Executivo
</h3>

<p>
${resumo.replace(/\[|\]/g,'')}
</p>

</div>

<div class="content">

<h3>
<i class="fas fa-briefcase"></i>
Experiência Profissional
</h3>

<p>
${experiencia.replace(/\[|\]/g,'')}
</p>

</div>

<div class="content">

<h3>
<i class="fas fa-graduation-cap"></i>
Formação Acadêmica
</h3>

<p>
${formacao.replace(/\[|\]/g,'')}
</p>

</div>

<div class="content">

<h3>
<i class="fas fa-star"></i>
Competências Estratégicas
</h3>

<div class="tags">

${habilidades
.replace(/\[|\]/g,'')
.split(',')
.map(skill=>`
<div class="tag">${skill.trim()}</div>
`).join('')}

</div>

</div>

<div class="export-grid">

<div class="export" onclick="exportar('pdf')">
<i class="fas fa-file-pdf" style="color:#ef4444;"></i>
PDF
</div>

<div class="export" onclick="exportar('doc')">
<i class="fas fa-file-word" style="color:#3b82f6;"></i>
WORD
</div>

<div class="export" onclick="exportar('xls')">
<i class="fas fa-file-excel" style="color:#10b981;"></i>
EXCEL
</div>

</div>

`;

window.curriculoData = {
nome,
resumo,
experiencia,
formacao,
habilidades
};

setTimeout(()=>{

document.getElementById('processing').style.display='none';
document.getElementById('dashboard').style.display='block';

},4200);

}catch(e){

alert('Erro ao gerar currículo.');

}

}

function exportar(tipo){

const titulo =
document.getElementById('docTitle').value || 'Elite_Curriculo';

const data = window.curriculoData;

if(!data){
alert('Nenhum currículo gerado.');
return;
}

if(tipo === 'pdf'){

const element = document.createElement('div');

element.innerHTML = `

<div style="
padding:40px;
font-family:Arial;
color:#111827;
">

<h1 style="
color:#5b4bff;
font-size:32px;
margin-bottom:10px;
">
${data.nome.replace(/\[|\]/g,'')}
</h1>

<hr style="margin:20px 0;">

<h2>Resumo Executivo</h2>

<p style="line-height:1.8;">
${data.resumo.replace(/\[|\]/g,'')}
</p>

<h2 style="margin-top:30px;">
Experiência Profissional
</h2>

<p style="line-height:1.8;">
${data.experiencia.replace(/\[|\]/g,'')}
</p>

<h2 style="margin-top:30px;">
Formação Acadêmica
</h2>

<p style="line-height:1.8;">
${data.formacao.replace(/\[|\]/g,'')}
</p>

<h2 style="margin-top:30px;">
Competências
</h2>

<p style="line-height:1.8;">
${data.habilidades.replace(/\[|\]/g,'')}
</p>

</div>

`;

html2pdf().from(element).set({
margin:1,
filename:titulo+'.pdf'
}).save();

}

if(tipo === 'doc'){

const blob = new Blob([
'\ufeff',

`
<h1>${data.nome}</h1>

<h2>Resumo Executivo</h2>

<p>${data.resumo}</p>

<h2>Experiência Profissional</h2>

<p>${data.experiencia}</p>

<h2>Formação Acadêmica</h2>

<p>${data.formacao}</p>

<h2>Competências</h2>

<p>${data.habilidades}</p>
`

],{
type:'application/msword'
});

const a = document.createElement('a');

a.href = URL.createObjectURL(blob);

a.download = titulo+'.doc';

a.click();

}

if(tipo === 'xls'){

const ws = XLSX.utils.aoa_to_sheet([

["Nome"],
[data.nome],

[],

["Resumo Executivo"],
[data.resumo],

[],

["Experiência"],
[data.experiencia],

[],

["Formação"],
[data.formacao],

[],

["Competências"],
[data.habilidades]

]);

const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "Curriculo");

XLSX.writeFile(wb, titulo+".xlsx");

}

}

</script>
