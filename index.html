<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,
signInWithRedirect,
getRedirectResult,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDFPrrCSowCUo3QJ6T280zja2Wqutlccvo",

authDomain: "elite-docsai.firebaseapp.com",

projectId: "elite-docsai",

storageBucket: "elite-docsai.firebasestorage.app",

messagingSenderId: "1048692395624",

appId: "1:1048692395624:web:74fb23e57580b9203ab5dd",

measurementId: "G-G63HC1V4FD"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

window.loginGoogle = async function(){

try{

await signInWithRedirect(auth, provider);

}catch(e){

alert("Erro Login Google: " + e.message);

}

};

getRedirectResult(auth)

.then((result)=>{

if(result){

const user = result.user;

localStorage.setItem(

"eliteUser",

JSON.stringify({

nome: user.displayName,

email: user.email,

foto: user.photoURL

})

);

location.reload();

}

})

.catch((error)=>{

console.log(error);

});

const userSalvo = localStorage.getItem("eliteUser");

if(userSalvo){

document.getElementById("loginScreen")
.classList.add("hidden");

document.getElementById("homeScreen")
.classList.remove("hidden");

const user = JSON.parse(userSalvo);

document.getElementById("userInfo").innerHTML = `

<div class="user-box">

<img src="${user.foto}" 
style="
width:45px;
height:45px;
border-radius:50%;
margin-right:10px;
">

<div>

<div style="font-weight:700;">
${user.nome}
</div>

<small>
${user.email}
</small>

</div>

</div>

`;

}

window.logoutGoogle = async function(){

await signOut(auth);

localStorage.removeItem("eliteUser");

location.reload();

};

</script>
