<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03030a;
            color: white;
            overflow-x: hidden;
            padding: 12px;
            background-image: 
                radial-gradient(circle at top, rgba(91,75,255,.2), transparent 35%),
                radial-gradient(circle at bottom, rgba(0,140,255,.1), transparent 30%);
        }

        .hidden { display: none; }

        .container {
            width: 100%;
            max-width: 100%;
            margin: auto;
        }

        /* HEADER ESTILO APP */
        .hero {
            text-align: center;
            padding: 20px 10px;
        }

        .logo {
            width: 180px;
            max-width: 80%;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(91,75,255,.4));
        }

        .hero h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .hero p {
            font-size: 14px;
            color: #9ca3af;
        }

        /* GRID ESTILO FOTO (3 COLUNAS) */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
            padding: 10px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 10px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.1);
        }

        .card i {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .card span {
            font-size: 12px;
            font-weight: 600;
            color: #efefef;
        }

        /* TELAS DE EDIÇÃO */
        .screen {
            margin-top: 10px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            padding: 20px;
            border-radius: 28px;
            backdrop-filter: blur(20px);
            width: 100%;
        }

        .back-btn {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            width: 100%;
        }

        .input, .textarea {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.05);
            color: white;
            margin-bottom: 12px;
            outline: none;
        }

        .textarea { min-height: 150px; }

        .generate-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg,#5b4bff,#4338ca);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .export-btn {
            margin-top: 15px;
            padding: 15px;
            border-radius: 14px;
            background: #10b981;
            text-align: center;
            font-weight: 700;
        }

        @media(min-width: 768px) {
            .grid { grid-template-columns: repeat(4, 1fr); max-width: 800px; margin: auto; }
        }
    </style>
</head>
<body>

<div class="container">

    <div id="homeScreen">
        <div class="hero">
            <img src="logo.png" class="logo" alt="Logo">
            <h1>Elite Docs AI</h1>
            <p>Gerencie e crie documentos com IA</p>
        </div>

        <div class="grid">
            <div class="card" onclick="abrirTela('pdfScreen')">
                <i class="fas fa-file-pdf" style="color:#ef4444"></i>
                <span>PDF</span>
            </div>
            <div class="card" onclick="aviso()">
                <i class="fas fa-file-word" style="color:#2b579a"></i>
                <span>Word</span>
            </div>
            <div class="card" onclick="aviso()">
                <i class="fas fa-file-excel" style="color:#217346"></i>
                <span>Excel</span>
            </div>
            <div class="card" onclick="aviso()">
                <i class="fas fa-file-powerpoint" style="color:#d24726"></i>
                <span>PPT</span>
            </div>
            <div class="card" onclick="aviso()">
                <i class="fas fa-file-alt" style="color:#607d8b"></i>
                <span>TXT</span>
            </div>
            <div class="card" onclick="aviso()">
                <i class="fas fa-image" style="color:#ffa000"></i>
                <span>Imagem</span>
            </div>
            <div class="card" onclick="abrirTela('curriculoScreen')">
                <i class="fas fa-user-tie" style="color:#5b4bff"></i>
                <span>Currículo</span>
            </div>
            <div class="card" onclick="abrirTela('linkedinScreen')">
                <i class="fab fa-linkedin" style="color:#0a66c2"></i>
                <span>LinkedIn</span>
            </div>
            <div class="card" onclick="abrirTela('cartaScreen')">
                <i class="fas fa-envelope" style="color:#10b981"></i>
                <span>Carta</span>
            </div>
        </div>
    </div>

    <div id="curriculoScreen" class="screen hidden">
        <button class="back-btn" onclick="voltar()">← Voltar</button>
        <input class="input" id="nome" placeholder="Nome completo">
        <input class="input" id="cargo" placeholder="Cargo">
        <input class="input" id="telefone" placeholder="Telefone">
        <textarea class="textarea" id="textoCurriculo" placeholder="Experiências..."></textarea>
        <button class="generate-btn" onclick="gerarCurriculo()">Gerar Currículo</button>
        <div id="previewCurriculo"></div>
    </div>

    <div id="pdfScreen" class="screen hidden">
        <button class="back-btn" onclick="voltar()">← Voltar</button>
        <input class="input" id="tituloPDF" placeholder="Título do Documento">
        <textarea class="textarea" id="textoPDF" placeholder="Conteúdo do PDF..."></textarea>
        <button class="generate-btn" onclick="gerarPDF()">Gerar PDF</button>
        <div id="previewPDF"></div>
    </div>

    <div id="linkedinScreen" class="screen hidden">
        <button class="back-btn" onclick="voltar()">← Voltar</button>
        <textarea class="textarea" id="textoLinkedin" placeholder="Sobre você para o LinkedIn..."></textarea>
        <button class="generate-btn" onclick="gerarSimples('previewLinkedin', 'Perfil LinkedIn', 'textoLinkedin')">Otimizar Perfil</button>
        <div id="previewLinkedin"></div>
    </div>

    <div id="cartaScreen" class="screen hidden">
        <button class="back-btn" onclick="voltar()">← Voltar</button>
        <textarea class="textarea" id="textoCarta" placeholder="Objetivo da carta..."></textarea>
        <button class="generate-btn" onclick="gerarSimples('previewCarta', 'Carta Profissional', 'textoCarta')">Criar Carta</button>
        <div id="previewCarta"></div>
    </div>

</div>

<script>
    function abrirTela(id) {
        document.getElementById('homeScreen').classList.add('hidden');
        document.querySelectorAll('.screen').forEach(t => t.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        window.scrollTo(0,0);
    }

    function voltar() {
        document.querySelectorAll('.screen').forEach(t => t.classList.add('hidden'));
        document.getElementById('homeScreen').classList.remove('hidden');
    }

    function aviso() {
        alert("Esta função de edição será liberada na próxima atualização!");
    }

    function gerarCurriculo() {
        const nome = document.getElementById('nome').value;
        const cargo = document.getElementById('cargo').value;
        const texto = document.getElementById('textoCurriculo').value;

        document.getElementById('previewCurriculo').innerHTML = `
            <div style="background:white; color:#111; padding:20px; border-radius:15px; margin-top:20px;">
                <h2 style="color:#005fcc">${nome}</h2>
                <p><b>${cargo}</b></p>
                <hr style="margin:10px 0">
                <p style="white-space: pre-wrap;">${texto}</p>
            </div>
            <div class="export-btn" onclick="baixarCurriculo()">Baixar PDF</div>
        `;
    }

    async function baixarCurriculo() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        pdf.text(document.getElementById('nome').value, 20, 20);
        pdf.text(document.getElementById('cargo').value, 20, 30);
        const linhas = pdf.splitTextToSize(document.getElementById('textoCurriculo').value, 170);
        pdf.text(linhas, 20, 50);
        pdf.save("curriculo.pdf");
    }

    function gerarPDF() {
        const titulo = document.getElementById('tituloPDF').value;
        const texto = document.getElementById('textoPDF').value;
        document.getElementById('previewPDF').innerHTML = `
            <div style="background:white; color:#111; padding:20px; border-radius:15px; margin-top:20px;">
                <h2>${titulo}</h2>
                <p style="white-space: pre-wrap;">${texto}</p>
            </div>
            <div class="export-btn" onclick="baixarPDFGeral()">Baixar PDF</div>
        `;
    }

    function baixarPDFGeral() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        pdf.text(document.getElementById('tituloPDF').value, 20, 20);
        const linhas = pdf.splitTextToSize(document.getElementById('textoPDF').value, 170);
        pdf.text(linhas, 20, 40);
        pdf.save("documento.pdf");
    }

    function gerarSimples(divId, titulo, inputId) {
        const texto = document.getElementById(inputId).value;
        document.getElementById(divId).innerHTML = `
            <div style="background:white; color:#111; padding:20px; border-radius:15px; margin-top:20px;">
                <h3 style="color:#5b4bff">${titulo}</h3>
                <p style="white-space: pre-wrap; margin-top:10px;">${texto}</p>
            </div>
        `;
    }
</script>

</body>
</html>
