<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI | Professional Intelligence</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-light: #818cf8;
            --bg: #070b14; 
            --card: #111827; 
            --text: #f9fafb;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- TELA DE ENTRADA (LANDING/LOGIN) --- */
        #login-screen {
            text-align: center;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            z-index: 10;
        }

        .hero-card {
            background: var(--card);
            padding: 50px 30px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        .logo-main {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, #c084fc 100%);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 30px;
            font-size: 35px;
            box-shadow: 0 20px 40px rgba(79, 70, 229, 0.4);
            color: white;
        }

        /* --- INTERFACE DO APP (ESCONDIDA) --- */
        #app-interface {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            animation: appIn 0.8s ease forwards;
        }

        @keyframes appIn {
            from { opacity: 0; transform: scale(0.95) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--glass);
            padding: 12px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 25px;
        }

        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-profile img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--primary); }

        .editor-container {
            background: var(--card);
            border-radius: 35px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        input, textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 20px;
            color: white;
            padding: 18px;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }

        textarea { height: 250px; resize: none; line-height: 1.6; }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .btn {
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 15px;
        }

        .btn-primary { background: var(--primary); color: white; grid-column: span 2; margin-bottom: 5px; }
        .btn-secondary { background: #10b981; color: white; }
        .btn-outline { background: #334155; color: white; }

        /* --- VISUALIZADOR (WORKSPACE) --- */
        #viewer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f1f5f9; z-index: 1000;
            display: none; overflow-y: auto;
        }

        .viewer-nav {
            background: #1e293b; padding: 15px 25px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0;
        }

        .paper {
            background: white;
            width: 90%; max-width: 800px;
            min-height: 1100px;
            margin: 40px auto;
            padding: 80px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            color: #1e293b;
        }

        .paper h1 { font-family: 'Playfair Display', serif; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; }
        .paper p { font-family: 'Lora', serif; font-size: 19px; line-height: 1.8; white-space: pre-line; text-align: justify; }

    </style>
</head>
<body>

    <div id="login-screen">
        <div class="hero-card">
            <div class="logo-main"><i class="fas fa-microchip"></i></div>
            <h1 style="font-size: 32px; margin: 0; letter-spacing: -1px;">Elite Docs AI</h1>
            <p style="color: #94a3b8; margin: 15px 0 40px; line-height: 1.5;">A Inteligência Artificial que transforma seus rascunhos em documentos de alto nível executivo.</p>
            
            <div id="g_id_onload"
                 data-client_id="SEU_CLIENT_ID_AQUI.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue" data-size="large" data-text="continue_with" data-logo_alignment="left"></div>
            
            <p style="font-size: 11px; color: #6366f1; margin-top: 25px; font-weight: 600;">🔒 Acesso Seguro via Google</p>
        </div>
    </div>

    <div id="app-interface">
        <div class="top-bar">
            <span style="font-weight: 800; color: var(--primary-light);">ELITE DOCS</span>
            <div class="user-profile">
                <span id="userName" style="font-size: 12px; font-weight: 600;">Carregando...</span>
                <img id="userPic" src="" alt="">
            </div>
        </div>

        <div class="editor-container">
            <label style="font-size: 10px; font-weight: 800; color: var(--primary-light); text-transform: uppercase;">Título do Documento</label>
            <input type="text" id="docTitle" placeholder="Ex: Relatório de Performance Q3">
            
            <label style="font-size: 10px; font-weight: 800; color: var(--primary-light); text-transform: uppercase;">Desenvolvimento da Ideia</label>
            <textarea id="textContent" placeholder="Fale ou escreva seus pontos principais aqui. A IA cuidará da elegância e formatação..."></textarea>

            <button class="btn btn-primary" onclick="refinarComIA()">
                <i class="fas fa-wand-sparkles"></i> Refinar com Inteligência Elite
            </button>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="abrirWorkspace()">
                    <i class="fas fa-file-signature"></i> Ver Documento
                </button>
                <button class="btn btn-outline" onclick="exportarExcel()">
                    <i class="fas fa-table"></i> Gerar Planilha
                </button>
            </div>
            
            <p id="statusMsg" style="text-align: center; font-size: 12px; color: #818cf8; margin-top: 15px; font-weight: 600;"></p>
        </div>
    </div>

    <div id="viewer-overlay">
        <div class="viewer-nav">
            <button onclick="fecharWorkspace()" style="background:none; color:white; border:none; cursor:pointer; font-weight: 700;"><i class="fas fa-arrow-left"></i> Voltar</button>
            <button onclick="exportarPDF()" style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-weight: 700;">Baixar PDF Final</button>
        </div>
        <div class="paper" id="paper-content">
            <h1 id="pTitle"></h1>
            <p id="pBody"></p>
        </div>
    </div>

    <script>
        // --- SISTEMA DE ACESSO ---
        function handleCredentialResponse(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            
            // Transição de Telas
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-interface').style.display = 'block';
            document.body.style.alignItems = 'flex-start';
            document.body.style.paddingTop = '40px';

            // Dados do Usuário
            document.getElementById('userPic').src = data.picture;
            document.getElementById('userName').innerText = data.given_name.toUpperCase();
        }

        // --- MOTOR DE IA ---
        async function refinarComIA() {
            const text = document.getElementById('textContent');
            const status = document.getElementById('statusMsg');
            if(!text.value) return;

            status.innerText = "⏳ IA ELITE está processando seu documento...";
            try {
                const prompt = "Aja como um redator sênior. Transforme este rascunho em um documento profissional, formal e impactante em português: " + text.value;
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                text.value = await response.text();
                status.innerText = "✅ Documento refinado com sucesso!";
            } catch (e) { status.innerText = "⚠️ Erro ao processar. Tente novamente."; }
        }

        // --- WORKSPACE & EXPORTAÇÃO ---
        function abrirWorkspace() {
            document.getElementById('pTitle').innerText = document.getElementById('docTitle').value || "DOCUMENTO SEM TÍTULO";
            document.getElementById('pBody').innerText = document.getElementById('textContent').value;
            document.getElementById('viewer-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function fecharWorkspace() {
            document.getElementById('viewer-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function exportarPDF() {
            const element = document.getElementById('paper-content');
            const title = document.getElementById('docTitle').value || "Elite_Doc";
            html2pdf().from(element).set({ margin: 1, filename: title + '.pdf' }).save();
        }

        function exportarExcel() {
            const content = document.getElementById('textContent').value;
            const rows = content.split('\n').map(r => [r]);
            const ws = XLSX.utils.aoa_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Dados Elite");
            XLSX.writeFile(wb, "Planilha_Elite.xlsx");
        }
    </script>
</body>
</html>
