<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #03030a;
            color: white;
            padding: 12px;
            background-image: radial-gradient(circle at top, rgba(91,75,255,.15), transparent 40%);
        }

        .container { width: 100%; max-width: 600px; margin: auto; }

        .hero { text-align: center; padding: 30px 10px; }
        .hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .hero p { color: #9ca3af; font-size: 14px; margin-top: 5px; }

        /* GRID ESTILO APP LEITOR */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 5px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.1); }
        .card i { font-size: 30px; margin-bottom: 8px; }
        .card span { font-size: 12px; font-weight: 600; color: #eee; }

        /* TELAS */
        .screen {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            margin-top: 10px;
        }

        .hidden { display: none; }

        .back-btn {
            background: none;
            color: #5b4bff;
            border: none;
            font-weight: 700;
            margin-bottom: 15px;
            cursor: pointer;
            font-size: 16px;
        }

        .input, .textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            margin-bottom: 10px;
            outline: none;
        }

        .textarea { min-height: 120px; }

        .generate-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #5b4bff;
            color: white;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
        }

        .preview-box {
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 12px;
            min-height: 100px;
        }

        .download-btn {
            background: #10b981;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="homeScreen">
        <div class="hero">
            <h1>Elite Docs AI</h1>
            <p>Seus documentos com perfeição</p>
        </div>

        <div class="grid">
            <div class="card" onclick="abrirTela('pdfScreen')">
                <i class="fas fa-file-pdf" style="color:#ef4444"></i>
                <span>PDF</span>
            </div>
            <div class="card" onclick="alert('Funcionalidade em breve!')">
                <i class="fas fa-file-word" style="color:#2b579a"></i>
                <span>Word</span>
            </div>
            <div class="card" onclick="alert('Funcionalidade em breve!')">
                <i class="fas fa-file-excel" style="color:#217346"></i>
                <span>Excel</span>
            </div>
            <div class="card" onclick="abrirTela('curriculoScreen')">
                <i class="fas fa-user-tie" style="color:#5b4bff"></i>
                <span>Currículo</span>
            </div>
            <div class="card" onclick="abrirTela('linkedinScreen')">
                <i class="fab fa-linkedin" style="color:#0a66c2"></i>
                <span>LinkedIn</span>
            </div>
            <div class="card" onclick="abrirTela('cartaScreen')">
                <i class="fas fa-envelope" style="color:#f59e0b"></i>
                <span>Carta</span>
            </div>
        </div>
    </div>

    <div id="curriculoScreen" class="screen hidden">
        <button class="back-btn" onclick="voltar()">← Voltar</button>
        <input class="input" id="nome" placeholder="Nome Completo">
        <input class="input" id="cargo" placeholder="Cargo (Ex: Arquiteto)">
        <input class="input" id="telefone" placeholder="Telefone">
        <input class="input" id="email" placeholder="Email">
        <input class="input" id="cidade" placeholder="Cidade/Estado">
        <textarea class="textarea" id="textoCurriculo" placeholder="Resumo profissional e experiências..."></textarea>
        
        <button class="generate-btn" onclick="previaCurriculo()">Ver Prévia</button>
        
        <div id="areaPreview" class="hidden">
            <div class="preview-box" id="previewTexto"></div>
            <div class="download-btn" onclick="baixarCurriculoPremium()">
                <i class="fas fa-download"></i> BAIXAR PDF PREMIUM
            </div>
        </div>
    </div>

    <div id="pdfScreen" class="screen hidden"><button class="back-btn" onclick="voltar()">← Voltar</button><p>Criação de PDF padrão...</p></div>
    <div id="linkedinScreen" class="screen hidden"><button class="back-btn" onclick="voltar()">← Voltar</button><p>Otimização de LinkedIn...</p></div>
    <div id="cartaScreen" class="screen hidden"><button class="back-btn" onclick="voltar()">← Voltar</button><p>Carta de apresentação...</p></div>
</div>

<script>
    function abrirTela(id) {
        document.getElementById('homeScreen').classList.add('hidden');
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function voltar() {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('homeScreen').classList.remove('hidden');
    }

    function previaCurriculo() {
        const nome = document.getElementById('nome').value;
        const cargo = document.getElementById('cargo').value;
        if(!nome) return alert("Digite ao menos o nome");
        
        document.getElementById('areaPreview').classList.remove('hidden');
        document.getElementById('previewTexto').innerHTML = `<b>${nome}</b><br>${cargo}<br><br>Gerando layout premium...`;
    }

    async function baixarCurriculoPremium() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: 'a4' });

        const nome = document.getElementById('nome').value.toUpperCase();
        const cargo = document.getElementById('cargo').value;
        const tel = document.getElementById('telefone').value;
        const email = document.getElementById('email').value;
        const cidade = document.getElementById('cidade').value;
        const texto = document.getElementById('textoCurriculo').value;

        // 1. Barra Lateral Azul
        pdf.setFillColor(0, 95, 204);
        pdf.rect(0, 0, 65, 297, 'F');

        // 2. Círculo da Foto
        pdf.setFillColor(230, 230, 230);
        pdf.circle(32.5, 30, 18, 'F');

        // 3. Texto Barra Lateral (Branco)
        pdf.setTextColor(255, 255, 255);
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(10);
        pdf.text("CONTATO", 10, 65);
        pdf.setLineWidth(0.3);
        pdf.setDrawColor(255, 255, 255);
        pdf.line(10, 67, 55, 67);

        pdf.setFontSize(8);
        pdf.setFont("helvetica", "normal");
        pdf.text(`Tel: ${tel}`, 10, 75);
        pdf.text(email, 10, 82, { maxWidth: 45 });
        pdf.text(cidade, 10, 95, { maxWidth: 45 });

        pdf.setFont("helvetica", "bold");
        pdf.text("HABILIDADES", 10, 115);
        pdf.line(10, 117, 55, 117);
        pdf.setFont("helvetica", "normal");
        pdf.text("• Comunicação\n• Liderança\n• Trabalho em Equipe", 10, 125);

        // 4. Lado Direito (Conteúdo)
        pdf.setTextColor(0, 95, 204);
        pdf.setFontSize(22);
        pdf.setFont("helvetica", "bold");
        pdf.text(nome, 72, 25);

        pdf.setTextColor(100, 100, 100);
        pdf.setFontSize(14);
        pdf.text(cargo, 72, 33);

        pdf.setTextColor(0, 95, 204);
        pdf.setFontSize(12);
        pdf.text("RESUMO PROFISSIONAL", 72, 55);
        pdf.setDrawColor(0, 95, 204);
        pdf.line(72, 57, 200, 57);

        pdf.setTextColor(50, 50, 50);
        pdf.setFontSize(10);
        pdf.setFont("helvetica", "normal");
        const linhas = pdf.splitTextToSize(texto, 120);
        pdf.text(linhas, 72, 65);

        // 5. Seção Experiência (Simulada para visual)
        let proximaY = 65 + (linhas.length * 5) + 10;
        pdf.setTextColor(0, 95, 204);
        pdf.setFont("helvetica", "bold");
        pdf.text("EXPERIÊNCIA", 72, proximaY);
        pdf.line(72, proximaY + 2, 200, proximaY + 2);

        pdf.save("curriculo-premium.pdf");
    }
</script>

</body>
</html>
