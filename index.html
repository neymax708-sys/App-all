<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Docs AI</title>

<link rel="icon" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#050510;
color:white;
padding:12px;
min-height:100vh;
background-image:
radial-gradient(circle at top,
rgba(91,75,255,.25),
transparent 35%);
}

.container{
max-width:700px;
margin:auto;
}

.hidden{
display:none !important;
}

.hero{
text-align:center;
padding:25px 10px;
}

.logo-app{
width:110px;
height:110px;
border-radius:24px;
margin-bottom:15px;
box-shadow:0 0 25px rgba(91,75,255,.4);
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:25px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:22px 10px;
border-radius:24px;
display:flex;
flex-direction:column;
align-items:center;
cursor:pointer;
transition:.25s;
backdrop-filter:blur(10px);
}

.card:active{
transform:scale(.95);
}

.card i{
font-size:30px;
margin-bottom:10px;
}

.card span{
font-size:13px;
font-weight:700;
}

.screen{
margin-top:15px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
padding:20px;
border-radius:24px;
}

.input,.textarea,select{
width:100%;
padding:15px;
margin-bottom:12px;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.05);
color:white;
outline:none;
font-size:14px;
}

.textarea{
min-height:160px;
resize:none;
}

.generate-btn{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
color:white;
font-weight:700;
cursor:pointer;
margin-top:5px;
}

.back-btn{
background:none;
border:none;
color:#7c6cff;
font-size:15px;
font-weight:bold;
margin-bottom:15px;
cursor:pointer;
}

.user-info-bar{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:15px;
}

.user-info-bar img{
width:55px;
height:55px;
border-radius:50%;
border:3px solid #5b4bff;
object-fit:cover;
}

.login-box{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.login-btn{
padding:16px 24px;
border:none;
border-radius:14px;
background:white;
color:#111;
font-weight:700;
cursor:pointer;
font-size:15px;
}

.preview{
background:white;
color:black;
padding:20px;
border-radius:18px;
margin-top:15px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

<div class="login-box">

<img src="logo.png" style="width:120px;margin-bottom:20px;">

<h1 style="margin-bottom:10px;">
Elite Docs AI
</h1>

<p style="margin-bottom:30px;color:#aaa;">
Entre com sua conta Google
</p>

<button onclick="fazerLogin()" class="login-btn">
<i class="fab fa-google"></i>
Entrar com Google
</button>

</div>

</div>

<!-- APP -->

<div class="container" id="appScreen" style="display:none;">

<div class="hero">

<img src="logo.png" class="logo-app">

<h1>Elite Docs AI</h1>

<div class="user-info-bar">

<img id="userPhoto">

<div>

<div id="userName" style="font-weight:700;"></div>

<button onclick="sairConta()"
style="
background:none;
border:none;
color:#ff4d4d;
cursor:pointer;
font-size:13px;
font-weight:bold;
">
Sair
</button>

</div>

</div>

</div>

<!-- MENU -->

<div class="grid" id="mainGrid">

<div class="card" onclick="abrirTela('curriculoScreen')">
<i class="fas fa-user-tie" style="color:#5b4bff"></i>
<span>Currículo</span>
</div>

<div class="card" onclick="abrirTela('pdfScreen')">
<i class="fas fa-file-pdf" style="color:#ef4444"></i>
<span>PDF</span>
</div>

<div class="card" onclick="abrirTela('wordScreen')">
<i class="fas fa-file-word" style="color:#2b579a"></i>
<span>Word</span>
</div>

<div class="card" onclick="abrirTela('txtScreen')">
<i class="fas fa-file-lines" style="color:#aaa"></i>
<span>TXT</span>
</div>

<div class="card" onclick="abrirTela('linkedinScreen')">
<i class="fab fa-linkedin" style="color:#0a66c2"></i>
<span>LinkedIn</span>
</div>

<div class="card" onclick="abrirTela('assinaturaScreen')">
<i class="fas fa-signature" style="color:#06b6d4"></i>
<span>Assinatura</span>
</div>

</div>

<!-- CURRICULO -->

<div id="curriculoScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<h2 style="margin-bottom:20px;">
Criar Currículo
</h2>

<input class="input" id="nome" placeholder="Nome completo">

<input class="input" id="cargo" placeholder="Cargo pretendido">

<input class="input" id="whatsapp" placeholder="WhatsApp">

<input class="input" id="email" placeholder="E-mail">

<textarea class="textarea"
id="resumo"
placeholder="Resumo profissional"></textarea>

<button class="generate-btn"
onclick="gerarCurriculo()">
GERAR CURRÍCULO
</button>

</div>

<!-- PDF -->

<div id="pdfScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<h2 style="margin-bottom:20px;">
Criador PDF
</h2>

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
">

<button class="generate-btn"
onclick="mostrarPDFTexto()">
PDF TEXTO
</button>

<button class="generate-btn"
style="background:linear-gradient(135deg,#06b6d4,#2563eb);"
onclick="mostrarPDFFoto()">
PDF FOTO
</button>

</div>

<!-- TEXTO -->

<div id="pdfTextoArea">

<input class="input"
id="pdfTitulo"
placeholder="Título">

<textarea class="textarea"
id="pdfTexto"
placeholder="Digite o conteúdo"></textarea>

<button class="generate-btn"
onclick="abrirConfigPDF('texto')">
GERAR PDF
</button>

</div>

<!-- FOTO -->

<div id="pdfFotoArea" class="hidden">

<input class="input"
id="pdfFotoTitulo"
placeholder="Nome do PDF">

<input class="input"
type="file"
id="pdfImagem"
accept="image/*">

<button class="generate-btn"
style="background:linear-gradient(135deg,#06b6d4,#2563eb);"
onclick="abrirConfigPDF('foto')">
GERAR PDF COM FOTO
</button>

</div>

</div>

<!-- WORD -->

<div id="wordScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<input class="input"
id="wordTexto"
placeholder="Texto Word">

<button class="generate-btn"
onclick="baixarWord()">
BAIXAR DOC
</button>

</div>

<!-- TXT -->

<div id="txtScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<textarea class="textarea"
id="txtTexto"
placeholder="Digite seu texto"></textarea>

<button class="generate-btn"
onclick="baixarTXT()">
BAIXAR TXT
</button>

</div>

<!-- LINKEDIN -->

<div id="linkedinScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<textarea class="textarea"
id="linkedinTexto"
placeholder="Fale sobre você"></textarea>

<button class="generate-btn"
onclick="gerarLinkedin()">
GERAR TEXTO
</button>

</div>

<!-- ASSINATURA -->

<div id="assinaturaScreen" class="screen hidden">

<button onclick="voltar()" class="back-btn">
← Voltar
</button>

<input class="input"
id="assinaturaNome"
placeholder="Seu nome">

<div id="assinaturaPreview"
class="preview"
style="
font-family:cursive;
font-size:35px;
text-align:center;
">
Sua Assinatura
</div>

<button class="generate-btn"
onclick="gerarAssinatura()">
GERAR ASSINATURA
</button>

</div>

</div>

<!-- MODAL PDF -->

<div id="configPDFModal"
class="hidden"
style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
display:flex;
justify-content:center;
align-items:flex-end;
z-index:999;
">

<div style="
background:white;
width:100%;
max-width:700px;
border-radius:30px 30px 0 0;
padding:25px;
color:#111;
">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

<h1>
Converter para PDF
</h1>

<button onclick="fecharConfigPDF()"
style="
background:none;
border:none;
font-size:35px;
cursor:pointer;
">
×
</button>

</div>

<input id="nomePDFFinal"
placeholder="Nome PDF"
style="
width:100%;
padding:15px;
border-radius:14px;
border:1px solid #ddd;
margin-bottom:15px;
">

<select id="tamanhoPDF">

<option value="a4">A4</option>

<option value="letter">Letter</option>

</select>

<select id="orientacaoPDF">

<option value="portrait">Retrato</option>

<option value="landscape">Paisagem</option>

</select>

<div style="
display:flex;
gap:10px;
margin-top:20px;
">

<button onclick="fecharConfigPDF()"
style="
flex:1;
padding:15px;
border-radius:14px;
border:2px solid #5b4bff;
background:white;
color:#5b4bff;
font-weight:700;
">

PRÉVIA

</button>

<button onclick="confirmarGeracaoPDF()"
style="
flex:1;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
color:white;
font-weight:700;
">

CONVERTER

</button>

</div>

</div>

</div>

<!-- SCRIPTS -->

<script>

function abrirTela(id){
document.getElementById('mainGrid').classList.add('hidden');
document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
}

function voltar(){
document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
document.getElementById('mainGrid').classList.remove('hidden');
}

function gerarCurriculo(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

const nome =
document.getElementById("nome").value;

const cargo =
document.getElementById("cargo").value;

const whats =
document.getElementById("whatsapp").value;

const email =
document.getElementById("email").value;

const resumo =
document.getElementById("resumo").value;

doc.setFillColor(91,75,255);

doc.rect(0,0,210,45,'F');

doc.setTextColor(255,255,255);

doc.setFontSize(24);

doc.text(nome,20,22);

doc.setFontSize(14);

doc.text(cargo,20,35);

doc.setTextColor(100);

doc.setFontSize(10);

doc.text(`${whats} | ${email}`,20,55);

doc.line(20,60,190,60);

doc.setTextColor(0);

doc.setFontSize(12);

const linhas =
doc.splitTextToSize(resumo,170);

doc.text(linhas,20,80);

doc.save("curriculo.pdf");

}

function baixarWord(){

const texto =
document.getElementById("wordTexto").value;

const blob =
new Blob([texto],
{type:"application/msword"});

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"arquivo.doc";

link.click();

}

function baixarTXT(){

const texto =
document.getElementById("txtTexto").value;

const blob =
new Blob([texto],
{type:"text/plain"});

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"arquivo.txt";

link.click();

}

async function gerarLinkedin(){

const campo =
document.getElementById("linkedinTexto");

const texto =
campo.value;

campo.value =
"IA escrevendo...";

try{

const r =
await fetch(
"https://text.pollinations.ai/" +
encodeURIComponent(
"Crie um texto profissional para LinkedIn: " + texto
)
);

campo.value =
await r.text();

}catch(e){

campo.value =
"Erro IA";

}

}

function gerarAssinatura(){

const nome =
document.getElementById("assinaturaNome").value;

document.getElementById("assinaturaPreview").innerText =
nome;

}

let tipoPDFAtual = "texto";

function mostrarPDFTexto(){
document.getElementById("pdfTextoArea").classList.remove("hidden");
document.getElementById("pdfFotoArea").classList.add("hidden");
}

function mostrarPDFFoto(){
document.getElementById("pdfTextoArea").classList.add("hidden");
document.getElementById("pdfFotoArea").classList.remove("hidden");
}

function abrirConfigPDF(tipo){
tipoPDFAtual = tipo;
document.getElementById("configPDFModal").classList.remove("hidden");
}

function fecharConfigPDF(){
document.getElementById("configPDFModal").classList.add("hidden");
}

async function confirmarGeracaoPDF(){

const { jsPDF } = window.jspdf;

const orientacao =
document.getElementById("orientacaoPDF").value;

const formato =
document.getElementById("tamanhoPDF").value;

const nome =
document.getElementById("nomePDFFinal").value || "EliteDocsPDF";

const doc = new jsPDF({
orientation: orientacao,
format: formato
});

if(tipoPDFAtual === "texto"){

const titulo =
document.getElementById("pdfTitulo").value;

const texto =
document.getElementById("pdfTexto").value;

doc.setFillColor(91,75,255);
doc.rect(0,0,220,35,'F');

doc.setTextColor(255,255,255);
doc.setFontSize(24);
doc.text(titulo || "Documento",20,22);

doc.setTextColor(0,0,0);
doc.setFontSize(13);

const linhas =
doc.splitTextToSize(texto,170);

doc.text(linhas,20,55);

doc.save(nome + ".pdf");

}

if(tipoPDFAtual === "foto"){

const file =
document.getElementById("pdfImagem").files[0];

if(!file){
alert("Escolha uma imagem");
return;
}

const reader = new FileReader();

reader.readAsDataURL(file);

reader.onload = function(e){

const img = new Image();

img.src = e.target.result;

img.onload = function(){

const largura =
doc.internal.pageSize.getWidth();

const altura =
doc.internal.pageSize.getHeight();

doc.addImage(
img,
'JPEG',
0,
0,
largura,
altura
);

doc.save(nome + ".pdf");

}

}

}

fecharConfigPDF();

}

</script>

<!-- FIREBASE -->

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithRedirect,
getRedirectResult,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyDFPrrCSowCUo3QJ6T280zja2Wqutlccvo",

authDomain:"elite-docsai.firebaseapp.com",

projectId:"elite-docsai",

storageBucket:"elite-docsai.firebasestorage.app",

messagingSenderId:"1048692395624",

appId:"1:1048692395624:web:74fb23e57580b9203ab5dd"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const provider =
new GoogleAuthProvider();

window.fazerLogin =
async function(){

await signInWithRedirect(auth, provider);

}

getRedirectResult(auth)
.then((result)=>{

if(result?.user){

mostrarApp(result.user);

}

});

function mostrarApp(user){

document.getElementById("loginScreen").style.display =
"none";

document.getElementById("appScreen").style.display =
"block";

document.getElementById("userName").innerText =
user.displayName;

if(user.photoURL){

document.getElementById("userPhoto").src =
user.photoURL;

}

}

onAuthStateChanged(auth,(user)=>{

if(user){

mostrarApp(user);

}else{

document.getElementById("loginScreen").style.display =
"block";

document.getElementById("appScreen").style.display =
"none";

}

});

window.sairConta =
async function(){

await signOut(auth);

location.reload();

}

</script>

</body>
</html>
