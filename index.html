<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Docs AI</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--primary:#5b4bff;
--secondary:#4338ca;
--bg:#05050a;
--glass:rgba(16,18,32,.6);
--border:rgba(255,255,255,.08);
--text:#f8fafc;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#05050a;
background-image:
radial-gradient(circle at top, rgba(91,75,255,.25), transparent 35%),
radial-gradient(circle at bottom, rgba(67,56,202,.15), transparent 30%);
color:white;
min-height:100vh;
padding:20px;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:rgba(91,75,255,.15);
filter:blur(120px);
top:-200px;
left:-100px;
z-index:-1;
}

.app{
max-width:1050px;
margin:auto;
}

.hero{
text-align:center;
margin-bottom:35px;
}

.logo{
width:120px;
height:120px;
margin:auto;
border-radius:35px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
box-shadow:0 0 60px rgba(91,75,255,.45);
margin-bottom:25px;
}

.hero h1{
font-family:'Poppins';
font-size:52px;
margin-bottom:15px;
}

.gradient{
background:linear-gradient(90deg,#fff,#9b8cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
max-width:700px;
margin:auto;
line-height:1.8;
color:#94a3b8;
}

.glass{
background:var(--glass);
border:1px solid var(--border);
backdrop-filter:blur(18px);
border-radius:30px;
padding:30px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

#login-gate{
max-width:420px;
margin:40px auto;
text-align:center;
}

.login-logo{
width:90px;
height:90px;
margin:auto;
border-radius:25px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
margin-bottom:20px;
}

#app-content{
display:none;
animation:fade .6s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

input,textarea,select{
width:100%;
padding:18px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
outline:none;
color:white;
font-family:'Inter';
margin-bottom:15px;
}

textarea{
min-height:180px;
resize:none;
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
color:white;
font-family:'Poppins';
font-weight:600;
font-size:15px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 40px rgba(91,75,255,.35);
}

.btn:hover{
transform:translateY(-3px);
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-top:25px;
}

.stat{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
text-align:center;
}

.stat h2{
font-size:28px;
color:#9b8cff;
}

.stat span{
font-size:12px;
color:#94a3b8;
}

.content{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
padding:25px;
border-radius:24px;
margin-top:20px;
}

.content h3{
margin-bottom:14px;
font-size:14px;
font-family:'Poppins';
color:#9b8cff;
text-transform:uppercase;
}

.content p{
line-height:1.8;
color:#d1d5db;
white-space:pre-line;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.tag{
padding:10px 16px;
border-radius:999px;
background:rgba(91,75,255,.12);
border:1px solid rgba(91,75,255,.25);
font-size:13px;
color:#c7c5ff;
}

.export-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:25px;
}

.export{
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
display:flex;
align-items:center;
justify-content:center;
gap:10px;
font-family:'Poppins';
font-weight:600;
cursor:pointer;
transition:.3s;
}

.export:hover{
transform:translateY(-3px);
}

@media(max-width:850px){

.hero h1{
font-size:36px;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.export-grid{
grid-template-columns:1fr;
}

.topbar{
flex-direction:column;
gap:15px;
}

}

</style>
</head>

<body>

<div class="app">

<div class="hero">

<div class="logo">
<i class="fas fa-brain"></i>
</div>

<h1>
Elite <span class="gradient">Docs AI</span>
</h1>

<p>
Crie currículos ATS, cartas profissionais, documentos premium e perfis LinkedIn usando IA.
</p>

</div>

<div id="login-gate" class="glass">

<div class="login-logo">
<i class="fas fa-bolt"></i>
</div>

<h2 style="font-family:Poppins;margin-bottom:10px;">
Entrar
</h2>

<p style="color:#94a3b8;margin-bottom:25px;">
Faça login para continuar.
</p>

<div id="g_id_onload"
data-client_id="593110663863-u9956693jafabtisfm0jnbgsufjd8n1f.apps.googleusercontent.com"
data-callback="handleCredentialResponse"
data-auto_prompt="false">
</div>

<div class="g_id_signin"
data-type="standard"
data-shape="pill"
data-theme="filled_blue"
data-size="large">
</div>

</div>

<div id="app-content">

<div class="glass">

<div class="topbar">

<h2 style="font-family:Poppins;">
Gerador Inteligente
</h2>

<img id="uPic"
src=""
style="width:45px;height:45px;border-radius:50%;border:2px solid #5b4bff;object-fit:cover;">

</div>

<select id="tipoDocumento">

<option value="curriculo">
Currículo ATS
</option>

<option value="linkedin">
Perfil LinkedIn
</option>

<option value="carta">
Carta Profissional
</option>

<option value="pdf">
Documento PDF
</option>

</select>

<input
type="text"
id="docTitle"
placeholder="Nome do documento">

<textarea
id="rawInput"
placeholder="Digite as informações aqui..."></textarea>

<button class="btn" onclick="gerarDocumento()">
<i class="fas fa-wand-magic-sparkles"></i>
Gerar Documento
</button>

<div id="dashboard"></div>

</div>

</div>

</div>

<script>

window.onload = function(){

const user = localStorage.getItem("eliteUser");

if(user){

const data = JSON.parse(user);

document.getElementById("login-gate").style.display = "none";

document.getElementById("app-content").style.display = "block";

document.getElementById("uPic").src = data.picture;

}

}

function handleCredentialResponse(response){

const data = JSON.parse(
atob(response.credential.split('.')[1])
);

localStorage.setItem("eliteUser", JSON.stringify({
name:data.name,
picture:data.picture
}));

document.getElementById("login-gate").style.display = "none";

document.getElementById("app-content").style.display = "block";

document.getElementById("uPic").src = data.picture;

}

async function gerarDocumento(){

const tipo =
document.getElementById('tipoDocumento').value;

const input =
document.getElementById('rawInput').value;

if(!input){
alert('Digite algo.');
return;
}

let prompt = '';

if(tipo === 'curriculo'){

prompt = `
Crie um currículo ATS premium.

RETORNE:

[NOME]
|||
[RESUMO]
|||
[EXPERIÊNCIA]
|||
[FORMAÇÃO]
|||
[HABILIDADES]

Texto:
${input}
`;

}

if(tipo === 'linkedin'){

prompt = `
Crie um perfil LinkedIn profissional premium.

Texto:
${input}
`;

}

if(tipo === 'carta'){

prompt = `
Crie uma carta profissional moderna.

Texto:
${input}
`;

}

if(tipo === 'pdf'){

prompt = `
Crie um documento profissional formatado.

Texto:
${input}
`;

}

const res = await fetch(
'https://text.pollinations.ai/' + encodeURIComponent(prompt)
);

const text = await res.text();

if(tipo === 'curriculo'){

const partes = text.split("|||");

const nome = partes[0] || '';
const resumo = partes[1] || '';
const experiencia = partes[2] || '';
const formacao = partes[3] || '';
const habilidades = partes[4] || '';

window.curriculoData = {
nome,
resumo,
experiencia,
formacao,
habilidades
};

document.getElementById('dashboard').innerHTML = `

<div class="stats">

<div class="stat">
<h2>98%</h2>
<span>ATS</span>
</div>

<div class="stat">
<h2>Elite</h2>
<span>Nível</span>
</div>

<div class="stat">
<h2>${habilidades.split(',').length}</h2>
<span>Skills</span>
</div>

<div class="stat">
<h2>AI+</h2>
<span>Premium</span>
</div>

</div>

<div class="content">
<h3>Nome</h3>
<p>${nome}</p>
</div>

<div class="content">
<h3>Resumo</h3>
<p>${resumo}</p>
</div>

<div class="content">
<h3>Experiência</h3>
<p>${experiencia}</p>
</div>

<div class="content">
<h3>Formação</h3>
<p>${formacao}</p>
</div>

<div class="content">

<h3>Competências</h3>

<div class="tags">

${habilidades.split(',').map(skill => `
<div class="tag">${skill.trim()}</div>
`).join('')}

</div>

</div>

<div class="export-grid">

<div class="export" onclick="baixarCurriculoPDF()">
<i class="fas fa-file-pdf" style="color:#ef4444;"></i>
Currículo PDF
</div>

<div class="export" onclick="baixarCurriculoDOC()">
<i class="fas fa-file-word" style="color:#3b82f6;"></i>
Currículo Word
</div>

<div class="export" onclick="baixarCurriculoXLS()">
<i class="fas fa-file-excel" style="color:#10b981;"></i>
Currículo Excel
</div>

</div>

`;

}else{

window.docTexto = text;

document.getElementById('dashboard').innerHTML = `

<div class="content">

<h3>Documento Gerado</h3>

<p>${text}</p>

</div>

<div class="export-grid">

<div class="export" onclick="baixarTextoPDF()">
<i class="fas fa-file-pdf" style="color:#ef4444;"></i>
Baixar PDF
</div>

<div class="export" onclick="baixarTextoDOC()">
<i class="fas fa-file-word" style="color:#3b82f6;"></i>
Baixar Word
</div>

<div class="export" onclick="baixarTextoTXT()">
<i class="fas fa-file-lines"></i>
Baixar TXT
</div>

</div>

`;

}

}

function baixarCurriculoPDF(){

const d = window.curriculoData;

const el = document.createElement('div');

el.innerHTML = `
<div style="padding:40px;font-family:Arial;">

<h1>${d.nome}</h1>

<h2>Resumo</h2>
<p>${d.resumo}</p>

<h2>Experiência</h2>
<p>${d.experiencia}</p>

<h2>Formação</h2>
<p>${d.formacao}</p>

<h2>Competências</h2>
<p>${d.habilidades}</p>

</div>
`;

html2pdf().from(el).save('curriculo.pdf');

}

function baixarCurriculoDOC(){

const d = window.curriculoData;

const blob = new Blob([`
<h1>${d.nome}</h1>
<h2>Resumo</h2>
<p>${d.resumo}</p>
<h2>Experiência</h2>
<p>${d.experiencia}</p>
<h2>Formação</h2>
<p>${d.formacao}</p>
<h2>Competências</h2>
<p>${d.habilidades}</p>
`],{
type:'application/msword'
});

const a = document.createElement('a');

a.href = URL.createObjectURL(blob);

a.download = 'curriculo.doc';

a.click();

}

function baixarCurriculoXLS(){

const d = window.curriculoData;

const ws = XLSX.utils.aoa_to_sheet([
["Nome"], [d.nome],
[],
["Resumo"], [d.resumo],
[],
["Experiência"], [d.experiencia],
[],
["Formação"], [d.formacao],
[],
["Competências"], [d.habilidades]
]);

const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "Curriculo");

XLSX.writeFile(wb, "curriculo.xlsx");

}

function baixarTextoPDF(){

const el = document.createElement('div');

el.innerHTML = `
<div style="padding:40px;font-family:Arial;">
${window.docTexto}
</div>
`;

html2pdf().from(el).save('documento.pdf');

}

function baixarTextoDOC(){

const blob = new Blob([
window.docTexto
],{
type:'application/msword'
});

const a = document.createElement('a');

a.href = URL.createObjectURL(blob);

a.download = 'documento.doc';

a.click();

}

function baixarTextoTXT(){

const blob = new Blob([
window.docTexto
],{
type:'text/plain'
});

const a = document.createElement('a');

a.href = URL.createObjectURL(blob);

a.download = 'documento.txt';

a.click();

}

</script>

</body>
</html>
