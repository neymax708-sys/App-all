<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #050510;
            color: white;
            padding: 15px;
            background-image: radial-gradient(circle at top, rgba(91, 75, 255, .15), transparent 40%);
            min-height: 100vh;
        }
        .hidden { display: none; }
        .container { max-width: 600px; margin: auto; }
        
        /* Tela de Login */
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }
        .login-box {
            background: rgba(255, 255, 255, .05);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, .1);
            text-align: center;
            width: 100%;
        }

        /* Botões e Inputs */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 15px;
        }
        .btn-google { background: white; color: #111; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, #5b4bff, #4338ca); color: white; }
        .btn:active { transform: scale(0.97); }

        /* Dashboard */
        .header { text-align: center; padding: 20px 0; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card {
            background: rgba(255, 255, 255, .05);
            padding: 20px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, .08);
        }
        .card i { font-size: 24px; color: #5b4bff; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen">
        <div class="login-box">
            <h1 style="margin-bottom: 10px;">Elite Docs AI</h1>
            <p style="color: #9ca3af; margin-bottom: 25px;">Acesse sua conta para começar</p>
            <button class="btn btn-google" onclick="loginGoogle()">
                <i class="fab fa-google"></i> Entrar com Google
            </button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <div class="header">
            <h1>Elite Docs AI</h1>
            <p id="userName" style="color: #5b4bff; font-weight: 600;"></p>
        </div>
        
        <div class="grid">
            <div class="card">
                <i class="fas fa-file-pdf"></i>
                <p>Criar PDF</p>
            </div>
            <div class="card">
                <i class="fas fa-user-tie"></i>
                <p>Currículos</p>
            </div>
        </div>
        
        <button class="btn" style="color: #ef4444;" onclick="logout()">Sair</button>
    </div>
</div>

<script>
    // Configurações do seu projeto Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDFPrrCSowCuo3QJ6T280zja2Wqutlccvo", // Chave corrigida
        authDomain: "elite-docsai.firebaseapp.com",
        projectId: "elite-docsai",
        storageBucket: "elite-docsai.appspot.com",
        messagingSenderId: "1048692395624",
        appId: "1:1048692395624:web:74fb23e57580b9203ab5dd",
        measurementId: "G-G63HC1V4FD"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);

    // Função de Login (Otimizada para Celular)
    function loginGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        // Usa Redirect para evitar bloqueio de janelas pop-up no mobile
        firebase.auth().signInWithRedirect(provider);
    }

    // Gerenciar estado do login ao carregar a página
    firebase.auth().onAuthStateChanged((user) => {
        if (user) {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("mainContent").classList.remove("hidden");
            document.getElementById("userName").innerText = "Olá, " + user.displayName;
        } else {
            document.getElementById("loginScreen").classList.remove("hidden");
            document.getElementById("mainContent").classList.add("hidden");
        }
    });

    // Capturar resultado do redirecionamento
    firebase.auth().getRedirectResult().catch((error) => {
        if (error.code === 'auth/api-key-not-valid') {
            alert("Erro: Chave de API inválida. Verifique o console do Firebase.");
        } else {
            console.error("Erro no login:", error.message);
        }
    });

    function logout() {
        firebase.auth().signOut();
    }
</script>

</body>
</html>
