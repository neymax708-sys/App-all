<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Docs AI</title>

<link rel="icon" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;

background:#050510;

color:white;

padding:12px;

background-image:
radial-gradient(circle at top, rgba(91,75,255,.18), transparent 35%);

}

.hidden{
display:none;
}

.container{
max-width:700px;
margin:auto;
}

.hero{
text-align:center;
padding:25px 10px;
}

.logo-app{

width:100px;

height:100px;

border-radius:24px;

margin-bottom:10px;

}

.grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:10px;

margin-top:20px;

}

.card{

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.1);

padding:18px 5px;

border-radius:22px;

display:flex;

flex-direction:column;

align-items:center;

cursor:pointer;

transition:.2s;

backdrop-filter:blur(10px);

}

.card:active{

transform:scale(.92);

}

.card i{

font-size:26px;

margin-bottom:8px;

}

.card span{

font-size:11px;

font-weight:700;

}

.screen{

margin-top:10px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.1);

padding:20px;

border-radius:24px;

}

.back-btn{

background:none;

border:none;

color:#5b4bff;

font-weight:700;

margin-bottom:15px;

cursor:pointer;

}

.input,
.textarea{

width:100%;

padding:14px;

margin-bottom:10px;

border-radius:12px;

border:1px solid rgba(255,255,255,.1);

background:rgba(255,255,255,.05);

color:white;

outline:none;

font-size:14px;

}

.textarea{
height:180px;
resize:none;
}

.generate-btn{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:linear-gradient(135deg,#5b4bff,#4338ca);

color:white;

font-weight:700;

cursor:pointer;

margin-top:5px;

}

.preview-box{

background:white;

color:#333;

padding:15px;

border-radius:15px;

margin-top:15px;

}

.login-screen{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

text-align:center;

}

.google-btn{

padding:15px 20px;

border:none;

border-radius:14px;

background:white;

color:black;

font-weight:700;

margin-top:20px;

cursor:pointer;

font-size:15px;

}

.user-box{

display:flex;

align-items:center;

gap:10px;

margin-top:15px;

justify-content:center;

}

.user-box img{

width:45px;

height:45px;

border-radius:50%;

}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

<img src="logo.png" class="logo-app">

<h1>Elite Docs AI</h1>

<p style="margin-top:10px;color:#aaa;">

Entre com Google para continuar

</p>

<button class="google-btn" onclick="loginGoogle()">

<i class="fab fa-google"></i>

Entrar com Google

</button>

</div>

<!-- APP -->

<div class="container hidden" id="homeScreen">

<div class="hero">

<img src="logo.png" class="logo-app">

<h1>Elite Docs AI</h1>

<p style="color:#aaa;">

Documentos inteligentes com IA

</p>

<div id="userInfo"></div>

<button
onclick="logoutGoogle()"
style="
margin-top:10px;
background:#ef4444;
border:none;
padding:10px 14px;
border-radius:12px;
color:white;
font-weight:700;
cursor:pointer;
">

Sair

</button>

</div>

<div class="grid">

<div class="card" onclick="abrirTela('curriculoScreen')">

<i class="fas fa-user-tie" style="color:#5b4bff"></i>

<span>Currículo</span>

</div>

<div class="card" onclick="abrirTela('pdfScreen')">

<i class="fas fa-file-pdf" style="color:#ef4444"></i>

<span>PDF</span>

</div>

<div class="card" onclick="abrirTela('wordScreen')">

<i class="fas fa-file-word" style="color:#2b579a"></i>

<span>Word</span>

</div>

<div class="card" onclick="abrirTela('txtScreen')">

<i class="fas fa-file-lines" style="color:#9ca3af"></i>

<span>TXT</span>

</div>

<div class="card" onclick="abrirTela('linkedinScreen')">

<i class="fab fa-linkedin" style="color:#0a66c2"></i>

<span>LinkedIn</span>

</div>

<div class="card" onclick="abrirTela('assinaturaScreen')">

<i class="fas fa-signature" style="color:#06b6d4"></i>

<span>Assinatura</span>

</div>

</div>

<!-- CURRICULO -->

<div id="curriculoScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">

← Voltar

</button>

<input class="input" id="nome" placeholder="Nome">

<input class="input" id="cargo" placeholder="Cargo">

<input class="input" id="email" placeholder="Email">

<input class="input" type="file" id="fotoInput">

<textarea class="textarea" id="resumo" placeholder="Resumo profissional"></textarea>

<button class="generate-btn"
onclick="usarIA('resumo','Melhore esse currículo profissionalmente')">

✨ Melhorar IA

</button>

<button class="generate-btn"
onclick="gerarPDFPremium()">

BAIXAR PDF

</button>

</div>

<!-- PDF -->

<div id="pdfScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">

← Voltar

</button>

<input class="input" id="pdfTitulo" placeholder="Título">

<textarea class="textarea" id="pdfTexto"></textarea>

<button class="generate-btn"
onclick="gerarPDF()">

GERAR PDF

</button>

</div>

<!-- WORD -->

<div id="wordScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">

← Voltar

</button>

<textarea class="textarea" id="wordTexto"></textarea>

<button class="generate-btn"
onclick="baixarWord()">

BAIXAR DOC

</button>

</div>

<!-- TXT -->

<div id="txtScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">

← Voltar

</button>

<textarea class="textarea" id="txtTexto"></textarea>

<button class="generate-btn"
onclick="baixarTXT()">

BAIXAR TXT

</button>

</div>

<!-- LINKEDIN -->

<div id="linkedinScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">

← Voltar

</button>

<textarea class="textarea" id="linkedinTexto"></textarea>

<button class="generate-btn"
onclick="usarIA('linkedinTexto','Crie um LinkedIn profissional')">

GERAR LINKEDIN

</button>

</div>

<!-- ASSINATURA -->

<div id="assinaturaScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">

← Voltar

</button>

<input class="input" id="assinaturaNome" placeholder="Seu nome">

<div id="assinaturaPreview"
class="preview-box"
style="
font-size:35px;
font-family:cursive;
text-align:center;
">

Assinatura

</div>

<button class="generate-btn"
onclick="gerarAssinatura()">

GERAR

</button>

</div>

</div>

<script>

function abrirTela(id){

document.querySelectorAll('.screen')
.forEach(s=>s.classList.add('hidden'));

document.getElementById(id)
.classList.remove('hidden');

}

function voltar(){

document.querySelectorAll('.screen')
.forEach(s=>s.classList.add('hidden'));

}

async function usarIA(id, comando){

const campo =
document.getElementById(id);

const original =
campo.value;

campo.value =
"IA processando...";

try{

const r = await fetch(

'https://text.pollinations.ai/' +

encodeURIComponent(comando + ': ' + original)

);

campo.value =
await r.text();

}catch(e){

campo.value = original;

alert("Erro IA");

}

}

async function gerarPDFPremium(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

doc.setFontSize(22);

doc.text(

document.getElementById('nome').value,

20,

20

);

doc.setFontSize(14);

doc.text(

document.getElementById('cargo').value,

20,

35

);

doc.text(

document.getElementById('email').value,

20,

45

);

const linhas =
doc.splitTextToSize(

document.getElementById('resumo').value,

170

);

doc.text(linhas,20,65);

doc.save("curriculo.pdf");

}

function gerarPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

doc.text(

document.getElementById('pdfTitulo').value,

20,

20

);

const linhas =
doc.splitTextToSize(

document.getElementById('pdfTexto').value,

170

);

doc.text(linhas,20,40);

doc.save("documento.pdf");

}

function baixarWord(){

const texto =
document.getElementById('wordTexto').value;

const blob = new Blob(

[texto],

{type:'application/msword'}

);

const a =
document.createElement('a');

a.href =
URL.createObjectURL(blob);

a.download =
"arquivo.doc";

a.click();

}

function baixarTXT(){

const texto =
document.getElementById('txtTexto').value;

const blob = new Blob(

[texto],

{type:'text/plain'}

);

const a =
document.createElement('a');

a.href =
URL.createObjectURL(blob);

a.download =
"arquivo.txt";

a.click();

}

function gerarAssinatura(){

document.getElementById(
'assinaturaPreview'
).innerText =

document.getElementById(
'assinaturaNome'
).value;

}

</script>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,
signInWithRedirect,
getRedirectResult,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDFPrrCSowCUo3QJ6T280zja2Wqutlccvo",

authDomain: "elite-docsai.firebaseapp.com",

projectId: "elite-docsai",

storageBucket: "elite-docsai.firebasestorage.app",

messagingSenderId: "1048692395624",

appId: "1:1048692395624:web:74fb23e57580b9203ab5dd"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

window.loginGoogle = async function(){

await signInWithRedirect(auth,provider);

};

getRedirectResult(auth)

.then((result)=>{

if(result){

const user = result.user;

localStorage.setItem(

'eliteUser',

JSON.stringify({

nome:user.displayName,

email:user.email,

foto:user.photoURL

})

);

location.reload();

}

});

const salvo =
localStorage.getItem('eliteUser');

if(salvo){

document.getElementById('loginScreen')
.classList.add('hidden');

document.getElementById('homeScreen')
.classList.remove('hidden');

const user =
JSON.parse(salvo);

document.getElementById('userInfo')
.innerHTML = `

<div class="user-box">

<img src="${user.foto}">

<div>

<div style="font-weight:700;">
${user.nome}
</div>

<small style="color:#aaa;">
${user.email}
</small>

</div>

</div>

`;

}

window.logoutGoogle = async function(){

await signOut(auth);

localStorage.removeItem('eliteUser');

location.reload();

};

</script>

</body>
</html>
