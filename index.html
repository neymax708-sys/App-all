<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Docs AI</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">

<meta name="theme-color" content="#5b4bff">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#050510;
color:white;
padding:12px;
overflow-x:hidden;
background-image:
radial-gradient(circle at top,
rgba(91,75,255,.18),
transparent 35%);
}

.hidden{
display:none;
}

.container{
max-width:700px;
margin:auto;
}

.hero{
text-align:center;
padding:25px 10px;
}

.logo-app{
width:95px;
height:95px;
border-radius:20px;
margin-bottom:15px;
object-fit:cover;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:18px 8px;
border-radius:22px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.2s;
backdrop-filter:blur(10px);
}

.card:active{
transform:scale(.93);
}

.card i{
font-size:28px;
margin-bottom:10px;
}

.card span{
font-size:11px;
font-weight:700;
}

.screen{
margin-top:10px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
padding:18px;
border-radius:24px;
backdrop-filter:blur(20px);
}

.back-btn{
background:none;
border:none;
color:#5b4bff;
font-weight:700;
margin-bottom:15px;
cursor:pointer;
font-size:15px;
}

.input,
.textarea{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.05);
color:white;
outline:none;
font-size:14px;
}

.textarea{
min-height:150px;
resize:none;
}

.generate-btn{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
color:white;
font-weight:700;
cursor:pointer;
margin-top:5px;
}

.preview-box{
background:white;
color:#222;
padding:18px;
border-radius:18px;
margin-top:15px;
line-height:1.7;
}

.google-btn{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:white;
color:#111;
font-weight:700;
cursor:pointer;
font-size:15px;
margin-top:15px;
}

.google-btn i{
margin-right:10px;
color:#ea4335;
}

.login-box{
max-width:420px;
margin:80px auto;
background:rgba(255,255,255,.05);
padding:30px 20px;
border-radius:28px;
border:1px solid rgba(255,255,255,.08);
text-align:center;
backdrop-filter:blur(20px);
}

.user-box{
display:flex;
align-items:center;
gap:10px;
margin-top:15px;
justify-content:center;
}

.user-box img{
width:40px;
height:40px;
border-radius:50%;
}

.logout-btn{
margin-top:15px;
background:#ef4444;
padding:12px;
border:none;
border-radius:12px;
color:white;
font-weight:700;
width:100%;
cursor:pointer;
}

@media(max-width:650px){

.grid{
grid-template-columns:repeat(3,1fr);
}

}

</style>

</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginScreen">

<div class="login-box">

<img src="logo.png" class="logo-app">

<h1 style="font-size:32px;">
Elite Docs AI
</h1>

<p style="
margin-top:10px;
color:#9ca3af;
font-size:14px;
">
Entre com Google para continuar
</p>

<button class="google-btn"
onclick="loginGoogle()">

<i class="fab fa-google"></i>

Entrar com Google

</button>

</div>

</div>

<!-- HOME -->

<div id="homeScreen" class="hidden">

<div class="hero">

<img src="logo.png" class="logo-app">

<h1>
Elite Docs AI
</h1>

<p style="
margin-top:8px;
color:#9ca3af;
font-size:14px;
">
Crie documentos profissionais
</p>

<div class="user-box">

<img id="userPhoto"
src="https://i.imgur.com/6VBx3io.png">

<div>

<div id="userName"></div>

<div id="userEmail"
style="
font-size:12px;
color:#9ca3af;
">
</div>

</div>

</div>

<button class="logout-btn"
onclick="logout()">

Sair

</button>

</div>

<div class="grid">

<div class="card"
onclick="irPara('curriculoScreen')">

<i class="fas fa-user-tie"
style="color:#5b4bff"></i>

<span>Currículo</span>

</div>

<div class="card"
onclick="irPara('pdfScreen')">

<i class="fas fa-file-pdf"
style="color:#ef4444"></i>

<span>PDF</span>

</div>

<div class="card"
onclick="irPara('wordScreen')">

<i class="fas fa-file-word"
style="color:#2b579a"></i>

<span>Word</span>

</div>

<div class="card"
onclick="irPara('txtScreen')">

<i class="fas fa-file-lines"
style="color:#9ca3af"></i>

<span>TXT</span>

</div>

<div class="card"
onclick="irPara('linkedinScreen')">

<i class="fab fa-linkedin"
style="color:#0a66c2"></i>

<span>LinkedIn</span>

</div>

<div class="card"
onclick="irPara('cartaScreen')">

<i class="fas fa-envelope"
style="color:#10b981"></i>

<span>Carta</span>

</div>

<div class="card"
onclick="irPara('assinaturaScreen')">

<i class="fas fa-signature"
style="color:#06b6d4"></i>

<span>Assinatura</span>

</div>

</div>

</div>

<!-- CURRICULO -->

<div id="curriculoScreen"
class="screen hidden">

<button class="back-btn"
onclick="voltar()">

← Voltar

</button>

<input class="input"
id="nome"
placeholder="Nome Completo">

<input class="input"
id="cargo"
placeholder="Cargo">

<input class="input"
id="tel"
placeholder="Telefone">

<input class="input"
id="email"
placeholder="E-mail">

<input class="input"
type="file"
id="fotoInput"
accept="image/*">

<textarea class="textarea"
id="resumo"
placeholder="Resumo profissional..."></textarea>

<button class="generate-btn"
style="background:#8b5cf6;"
onclick="usarIA('resumo',
'Melhore profissionalmente esse currículo')">

✨ Melhorar com IA

</button>

<button class="generate-btn"
onclick="gerarPDFPremium()">

BAIXAR PDF PREMIUM

</button>

</div>

<!-- PDF -->

<div id="pdfScreen"
class="screen hidden">

<button class="back-btn"
onclick="voltar()">

← Voltar

</button>

<input class="input"
id="pdfT"
placeholder="Título">

<textarea class="textarea"
id="pdfC"
placeholder="Digite o conteúdo..."></textarea>

<button class="generate-btn"
onclick="baixarPDF()">

Gerar PDF

</button>

</div>

<!-- WORD -->

<div id="wordScreen"
class="screen hidden">

<button class="back-btn"
onclick="voltar()">

← Voltar

</button>

<input class="input"
id="wordT"
placeholder="Título">

<textarea class="textarea"
id="wordC"
placeholder="Digite o conteúdo..."></textarea>

<button class="generate-btn"
onclick="baixarWord()">

Baixar Word

</button>

</div>

<!-- TXT -->

<div id="txtScreen"
class="screen hidden">

<button class="back-btn"
onclick="voltar()">

← Voltar

</button>

<textarea class="textarea"
id="txtConteudo"
placeholder="Digite qualquer texto"></textarea>

<button class="generate-btn"
onclick="baixarTXT()">

Baixar TXT

</button>

</div>

<!-- LINKEDIN -->

<div id="linkedinScreen"
class="screen hidden">

<button class="back-btn"
onclick="voltar()">

← Voltar

</button>

<textarea class="textarea"
id="linkIn"
placeholder="Digite informações profissionais"></textarea>

<button class="generate-btn"
onclick="usarIA('linkIn',
'Crie um LinkedIn profissional')">

Gerar LinkedIn

</button>

<div id="linkPreview"></div>

</div>

<!-- CARTA -->

<div id="cartaScreen"
class="screen hidden">

<button class="back-btn"
onclick="voltar()">

← Voltar

</button>

<textarea class="textarea"
id="cartaIn"
placeholder="Digite sua carta"></textarea>

<button class="generate-btn"
onclick="usarIA('cartaIn',
'Melhore profissionalmente essa carta')">

Gerar Carta

</button>

</div>

<!-- ASSINATURA -->

<div id="assinaturaScreen"
class="screen hidden">

<button class="back-btn"
onclick="voltar()">

← Voltar

</button>

<input class="input"
id="nomeAss"
placeholder="Seu nome">

<div id="assPreview"
class="preview-box"
style="
font-family:cursive;
font-size:35px;
text-align:center;
">

Assinatura

</div>

<button class="generate-btn"
onclick="gerarAssinatura()">

Gerar Assinatura

</button>

</div>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {

apiKey: "SUA_API_KEY",

authDomain: "SEU-PROJETO.firebaseapp.com",

projectId: "SEU-PROJETO",

appId: "SEU_APP_ID"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* LOGIN GOOGLE */

async function loginGoogle(){

const provider =
new firebase.auth.GoogleAuthProvider();

try{

const result =
await auth.signInWithPopup(provider);

const user = result.user;

localStorage.setItem(
'elite_user',
JSON.stringify({

nome:user.displayName,
email:user.email,
foto:user.photoURL

})
);

mostrarHome();

}catch(error){

alert(
'Erro Login Google:\n' +
error.message
);

}

}

/* MOSTRAR HOME */

function mostrarHome(){

const user =
JSON.parse(
localStorage.getItem('elite_user')
);

if(!user) return;

document.getElementById('loginScreen')
.classList.add('hidden');

document.getElementById('homeScreen')
.classList.remove('hidden');

document.getElementById('userName')
.innerText = user.nome;

document.getElementById('userEmail')
.innerText = user.email;

document.getElementById('userPhoto')
.src = user.foto;

}

/* LOGOUT */

function logout(){

localStorage.removeItem('elite_user');

location.reload();

}

/* TELAS */

function irPara(id){

document.getElementById('homeScreen')
.classList.add('hidden');

document.querySelectorAll('.screen')
.forEach(s=>{

s.classList.add('hidden');

});

document.getElementById(id)
.classList.remove('hidden');

}

function voltar(){

document.querySelectorAll('.screen')
.forEach(s=>{

s.classList.add('hidden');

});

document.getElementById('homeScreen')
.classList.remove('hidden');

}

/* IA */

async function usarIA(id, comando){

const campo =
document.getElementById(id);

const original =
campo.value;

campo.value =
'IA processando...';

try{

const resposta =
await fetch(
'https://text.pollinations.ai/' +
encodeURIComponent(
comando + ': ' + original
)
);

const resultado =
await resposta.text();

campo.value = resultado;

if(id === 'linkIn'){

document.getElementById(
'linkPreview'
).innerHTML = `

<div class="preview-box">

${resultado}

</div>

`;

}

}catch{

campo.value = original;

alert('Erro IA');

}

}

/* PDF CURRICULO */

async function gerarPDFPremium(){

const { jsPDF } =
window.jspdf;

const doc =
new jsPDF();

const nome =
document.getElementById('nome').value;

doc.setFillColor(0,95,204);

doc.rect(0,0,65,297,'F');

doc.setTextColor(255,255,255);

doc.setFontSize(18);

doc.text(nome || 'Elite User',
10,
75);

doc.setTextColor(0,95,204);

doc.setFontSize(22);

doc.text(
(nome || 'Currículo').toUpperCase(),
72,
30
);

const resumo =
document.getElementById('resumo').value;

doc.setFontSize(12);

doc.setTextColor(60,60,60);

const linhas =
doc.splitTextToSize(resumo,110);

doc.text(linhas,72,55);

const foto =
document.getElementById('fotoInput').files[0];

if(foto){

const reader =
new FileReader();

reader.readAsDataURL(foto);

reader.onload = function(e){

doc.addImage(
e.target.result,
'JPEG',
12,
15,
40,
40
);

doc.save(
'Curriculo_EliteDocs.pdf'
);

};

}else{

doc.save(
'Curriculo_EliteDocs.pdf'
);

}

}

/* PDF */

function baixarPDF(){

const { jsPDF } =
window.jspdf;

const doc =
new jsPDF();

doc.setFontSize(20);

doc.text(
document.getElementById('pdfT').value,
20,
20
);

doc.setFontSize(12);

const linhas =
doc.splitTextToSize(
document.getElementById('pdfC').value,
170
);

doc.text(linhas,20,40);

doc.save('Documento.pdf');

}

/* WORD */

function baixarWord(){

const texto =
document.getElementById('wordC').value;

const blob =
new Blob(
['\ufeff',texto],
{
type:'application/msword'
}
);

const a =
document.createElement('a');

a.href =
URL.createObjectURL(blob);

a.download =
(document.getElementById('wordT').value ||
'Documento') + '.doc';

a.click();

}

/* TXT */

function baixarTXT(){

const texto =
document.getElementById('txtConteudo').value;

const blob =
new Blob(
[texto],
{
type:'text/plain'
}
);

const a =
document.createElement('a');

a.href =
URL.createObjectURL(blob);

a.download =
'arquivo.txt';

a.click();

}

/* ASSINATURA */

function gerarAssinatura(){

document.getElementById(
'assPreview'
).innerText =

document.getElementById(
'nomeAss'
).value;

}

/* AUTO LOGIN */

window.onload = ()=>{

const user =
localStorage.getItem(
'elite_user'
);

if(user){

mostrarHome();

}

}

/* SERVICE WORKER */

if('serviceWorker' in navigator){

navigator.serviceWorker
.register('sw.js');

}

</script>

</body>
</html>
