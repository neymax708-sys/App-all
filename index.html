<style>
    /* Efeito de carregamento */
    .loading { 
        border: 4px solid rgba(255,255,255,0.1); 
        border-left-color: #4f46e5; 
        border-radius: 50%; 
        width: 24px; height: 24px; 
        animation: spin 1s linear infinite; 
        display: none; margin: 10px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Menu de estilos */
    .style-selector {
        display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px;
    }
    .style-btn {
        background: #1e293b; border: 1px solid #334155; color: #94a3b8;
        padding: 8px 15px; border-radius: 10px; font-size: 11px; cursor: pointer; white-space: nowrap;
    }
    .style-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }
</style>

<div class="style-selector">
    <button class="style-btn active" onclick="setStyle('Formal', this)">👔 Executivo</button>
    <button class="style-btn" onclick="setStyle('Criativo', this)">💡 Criativo</button>
    <button class="style-btn" onclick="setStyle('Direto', this)">🎯 Direto</button>
</div>
<div id="loader" class="loading"></div>

<script>
    let currentStyle = 'Formal';

    function setStyle(style, btn) {
        currentStyle = style;
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    async function aiRefine() {
        const body = document.getElementById('docBody');
        const loader = document.getElementById('loader');
        if(!body.value) return;

        const originalText = body.value;
        body.disabled = true; // Bloqueia para não digitar enquanto processa
        loader.style.display = 'block';
        
        try {
            const prompt = `Reescreva o seguinte texto em português com um tom ${currentStyle}: ${originalText}`;
            const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
            body.value = await res.text();
        } catch (e) {
            alert("Erro na conexão. Tente novamente.");
            body.value = originalText;
        } finally {
            body.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>
