<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente IA Profissional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --main: #6366f1; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); padding: 15px; display: flex; flex-direction: column; align-items: center; color: var(--text); }
        .card { background: white; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { color: var(--main); text-align: center; margin-top: 0; font-size: 22px; }
        input, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; margin: 10px 0; box-sizing: border-box; font-size: 16px; }
        textarea { height: 150px; resize: none; }
        .btn { width: 100%; padding: 14px; margin-top: 10px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; color: white; background: var(--main); font-size: 16px; transition: 0.3s; }
        .btn:active { transform: scale(0.98); }
        .btn-pdf { background: #1e293b; margin-top: 20px; }
        .status { font-size: 13px; color: #64748b; margin-top: 10px; text-align: center; font-weight: 500; }
        
        /* Área oculta para gerar o PDF */
        #pdf-preview { width: 210mm; background: white; padding: 40px; position: absolute; left: -9999px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>IA Gratuita Ilimitada</h2>
        
        <input type="text" id="docTitle" placeholder="Título do Documento (Ex: Relatório)">
        
        <textarea id="textContent" placeholder="Digite seu texto aqui (ex: 'sou jogador, melhora isso')"></textarea>
        
        <button class="btn" id="btnIA" onclick="callFreeIA()">✨ Melhorar Texto (Grátis)</button>
        <div id="statusMsg" class="status">Pronto para processar.</div>
        
        <button class="btn btn-pdf" onclick="downloadPDF()">📥 Baixar em PDF</button>
    </div>

    <div id="pdf-preview">
        <h1 id="pdfHeader" style="color: #6366f1; border-bottom: 2px solid #6366f1; padding-bottom: 10px; text-align: center;"></h1>
        <p id="pdfBody" style="white-space: pre-line; line-height: 1.8; font-size: 18px; color: #334155; margin-top: 30px;"></p>
    </div>

    <script>
        async function callFreeIA() {
            const status = document.getElementById('statusMsg');
            const field = document.getElementById('textContent');
            const btn = document.getElementById('btnIA');

            if(!field.value.trim()) return alert("Por favor, digite algum texto!");

            try {
                btn.disabled = true;
                btn.style.opacity = "0.7";
                status.innerText = "⏳ IA processando... Aguarde um instante.";

                // Pollinations AI: Conexão direta que funciona no GitHub Pages
                const promptOriginal = field.value;
                const promptInstrucao = "Aja como um redator profissional. Melhore, corrija a gramática e organize o seguinte texto em português: " + promptOriginal;
                
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptInstrucao)}`);

                if (!response.ok) throw new Error("O servidor de IA está instável. Tente novamente.");

                const result = await response.text();
                
                field.value = result.trim();
                status.innerText = "✅ Texto atualizado com sucesso!";

            } catch (err) {
                status.innerText = "❌ Erro: " + err.message;
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }

        function downloadPDF() {
            const title = document.getElementById('docTitle').value;
            const content = document.getElementById('textContent').value;

            if(!content) return alert("Não há texto para gerar o PDF!");

            const preview = document.getElementById('pdf-preview');
            document.getElementById('pdfHeader').innerText = title.toUpperCase() || "DOCUMENTO IA";
            document.getElementById('pdfBody').innerText = content;
            
            const opt = {
                margin: 15,
                filename: (title || 'documento') + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            statusMsg.innerText = "📥 Gerando seu PDF...";
            html2pdf().set(opt).from(preview).save().then(() => {
                statusMsg.innerText = "✅ PDF baixado!";
            });
        }
    </script>
</body>
</html>
