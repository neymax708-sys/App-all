<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Workspace AI v4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; text-align: center; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 10px 0; }
        label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
        input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: white; padding: 12px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        textarea { height: 180px; resize: none; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; }
        .grid-export { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 5px; }
        .export-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 5px; text-align: center; cursor: pointer; transition: 0.2s; }
        .export-box i { font-size: 20px; display: block; margin-bottom: 5px; }
        .mic-btn { background: #334155; color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; margin: -65px 10px 15px auto; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; transition: 0.3s; }
        .mic-active { background: #ef4444; box-shadow: 0 0 15px #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        #status { text-align: center; font-size: 13px; margin-top: 10px; color: #10b981; min-height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Elite Workspace AI</h1>
            <label>Título do Documento</label>
            <input type="text" id="docTitle" placeholder="Ex: Relatório Mensal">
            
            <label>Seu Conteúdo</label>
            <textarea id="textContent" placeholder="Fale ou digite aqui..."></textarea>
            
            <button class="mic-btn" id="micBtn" onclick="startVoice()">
                <i class="fas fa-microphone" id="micIcon"></i>
            </button>

            <button class="btn-main" onclick="askAI()">
                <i class="fas fa-wand-magic-sparkles"></i> Refinar com IA
            </button>
            <div id="status">Pronto</div>
        </div>

        <div class="card">
            <label>Exportar Arquivos</label>
            <div class="grid-export">
                <div class="export-box" onclick="saveFile('pdf')">
                    <i class="fas fa-file-pdf" style="color:#f87171"></i>
                    <span style="font-size:10px">PDF</span>
                </div>
                <div class="export-box" onclick="saveFile('doc')">
                    <i class="fas fa-file-word" style="color:#60a5fa"></i>
                    <span style="font-size:10px">WORD</span>
                </div>
                <div class="export-box" onclick="saveFile('xls')">
                    <i class="fas fa-file-excel" style="color:#34d399"></i>
                    <span style="font-size:10px">PLANILHA</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- VOZ ---
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'pt-BR';
        
        function startVoice() {
            const btn = document.getElementById('micBtn');
            const icon = document.getElementById('micIcon');
            btn.classList.add('mic-active');
            icon.className = "fas fa-circle-stop";
            recognition.start();
        }

        recognition.onresult = (e) => {
            document.getElementById('textContent').value += " " + e.results[0][0].transcript;
            stopVoice();
        };

        function stopVoice() {
            const btn = document.getElementById('micBtn');
            const icon = document.getElementById('micIcon');
            btn.classList.remove('mic-active');
            icon.className = "fas fa-microphone";
            recognition.stop();
        }

        // --- IA (CORS FIX) ---
        async function askAI() {
            const text = document.getElementById('textContent');
            const status = document.getElementById('status');
            if(!text.value) return;

            status.innerText = "⏳ IA Processando...";
            // Usando o endpoint via Pollinations que é amigável ao GitHub
            const prompt = `Aja como um redator profissional. Melhore e organize este texto: ${text.value}`;
            
            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const result = await response.text();
                text.value = result.trim();
                status.innerText = "✅ Refinado com sucesso!";
            } catch (e) {
                status.innerText = "❌ Erro: Tente novamente em instantes.";
            }
        }

        // --- EXPORTAÇÃO ---
        function saveFile(type) {
            const title = document.getElementById('docTitle').value || "Documento_IA";
            const content = document.getElementById('textContent').value;
            if(!content) return alert("Escreva algo antes!");

            if(type === 'pdf') {
                const opt = { margin: 1, filename: `${title}.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
                const template = `<div style="padding:40px; font-family:sans-serif;">
                    <h1 style="color:#6366f1; border-bottom:2px solid #6366f1; padding-bottom:10px;">${title}</h1>
                    <p style="white-space:pre-line; line-height:1.6; font-size:14px;">${content}</p>
                </div>`;
                html2pdf().set(opt).from(template).save();
            } else if(type === 'doc') {
                const blob = new Blob(['\ufeff', `<h1>${title}</h1><p>${content.replace(/\n/g, '<br>')}</p>`], { type: 'application/msword' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${title}.doc`;
                link.click();
            } else if(type === 'xls') {
                const csvContent = "data:text/csv;charset=utf-8,\ufeff" + content.split('\n').map(e => `"${e}"`).join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement('a');
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `${title}.csv`);
                link.click();
            }
        }
    </script>
</body>
</html>
