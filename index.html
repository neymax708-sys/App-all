#app-content{

@keyframes fade{

opacity:0;

to{

input,textarea{

textarea{

button{

.btn{

.btn:hover{

.stats{

.stat{

.content{

}

.content p{

.tags{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.tag{
padding:10px 16px;
border-radius:999px;
background:rgba(91,75,255,.12);
border:1px solid rgba(91,75,255,.25);
font-size:13px;
color:#c7c5ff;
}

.export-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;

}

.export{

}

.step.active{

transform:translateX(5px);
}

@media(max-width:800px){

.hero h1{
font-size:35px;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.export-grid{
grid-template-columns:1fr;
}

<script>

window.onload = () => {

const savedUser = localStorage.getItem("eliteUser");

if(savedUser){

const user = JSON.parse(savedUser);

document.getElementById('login-gate').style.display='none';

document.getElementById('app-content').style.display='block';

document.getElementById('uPic').src=user.picture;

}

}

function onLogin(res){

const data = JSON.parse(atob(res.credential.split('.')[1]));

localStorage.setItem("eliteUser", JSON.stringify({
name:data.name,
email:data.email,
picture:data.picture
}));

document.getElementById('login-gate').style.display='none';

document.getElementById('app-content').style.display='block';

document.getElementById('uPic').src=data.picture;

}

function logoutElite(){

localStorage.removeItem("eliteUser");

location.reload();

}

async function iniciarIA(){

const input = document.getElementById('rawInput').value;

if(!input){
alert('Digite informações.');
return;
}

document.getElementById('processing').style.display='block';

[1,2,3,4].forEach((i,index)=>{
setTimeout(()=>{
document.getElementById('s'+i).classList.add('active');
},index*900);
});

try{

const prompt = `
Você é especialista premium em RH.

Crie um currículo profissional ATS.

RETORNE EXATAMENTE:

[NOME]
|||
[RESUMO]
|||
[EXPERIÊNCIA]
|||
[FORMAÇÃO]
|||
[HABILIDADES separadas por vírgula]

Texto:
${input}
`;

const res = await fetch(
`https://text.pollinations.ai/${encodeURIComponent(prompt)}`
);

const text = await res.text();

const partes = text.split("|||");

const nome = partes[0] || "Profissional";
const resumo = partes[1] || "";
const experiencia = partes[2] || "";
const formacao = partes[3] || "";
const habilidades = partes[4] || "";

document.getElementById('dashboard').innerHTML = `

<span>ATS</span>
</div>

<div class="stat">

<span>Nível</span>
</div>

<div class="stat">
<h2>${habilidades.split(',').length}</h2>
<span>Skills</span>
</div>

<div class="stat">
<h2>AI+</h2>
<span>Premium</span>
</div>

</div>

<div class="content">

<h3>Nome Profissional</h3>

<p>${nome.replace(/\\[|\\]/g,'')}</p>

</div>

<div class="content">

<h3>Resumo Executivo</h3>

<p>${resumo.replace(/\\[|\\]/g,'')}</p>

</div>

<div class="content">

<h3>Experiência</h3>

<p>${experiencia.replace(/\\[|\\]/g,'')}</p>

</div>

<div class="content">

<h3>Formação</h3>

<p>${formacao.replace(/\\[|\\]/g,'')}</p>

</div>

<div class="content">

<h3>Competências</h3>

<div class="tags">

${habilidades.replace(/\\[|\\]/g,'').split(',').map(skill=>`
<div class="tag">${skill.trim()}</div>
`).join('')}

</div>

</div>

<div class="export-grid">

<div class="export" onclick="exportar('pdf')">
<i class="fas fa-file-pdf" style="color:#ef4444;"></i>
PDF
</div>

<div class="export" onclick="exportar('doc')">
<i class="fas fa-file-word" style="color:#3b82f6;"></i>
WORD
</div>

<div class="export" onclick="exportar('xls')">
<i class="fas fa-file-excel" style="color:#10b981;"></i>
EXCEL
</div>

</div>

`;

window.curriculoData = {
nome,
resumo,
experiencia,
formacao,
habilidades
};

setTimeout(()=>{
document.getElementById('processing').style.display='none';
},4200);

}catch(e){

alert('Erro ao gerar currículo.');

}

}
