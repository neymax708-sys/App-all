<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Docs AI</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--primary:#5b4bff;
--secondary:#4338ca;
--bg:#05050a;
--glass:rgba(18,20,40,.58);
--border:rgba(255,255,255,.08);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#05050a;
background-image:
radial-gradient(circle at top, rgba(91,75,255,.25), transparent 35%),
radial-gradient(circle at bottom, rgba(67,56,202,.15), transparent 30%);
color:white;
min-height:100vh;
padding:20px;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:rgba(91,75,255,.15);
filter:blur(120px);
top:-200px;
left:-100px;
z-index:-1;
}

.app{
max-width:1000px;
margin:auto;
}

.hero{
text-align:center;
margin-bottom:35px;
}

.logo{
width:120px;
height:120px;
margin:auto;
border-radius:35px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
box-shadow:0 0 60px rgba(91,75,255,.45);
margin-bottom:25px;
}

.hero h1{
font-family:'Poppins';
font-size:50px;
margin-bottom:15px;
}

.gradient{
background:linear-gradient(90deg,#fff,#9b8cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
max-width:700px;
margin:auto;
line-height:1.8;
color:#94a3b8;
}

.glass{
background:var(--glass);
border:1px solid var(--border);
backdrop-filter:blur(18px);
border-radius:30px;
padding:30px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

#login-gate{
max-width:420px;
margin:40px auto;
text-align:center;
}

.login-logo{
width:90px;
height:90px;
margin:auto;
border-radius:25px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
margin-bottom:20px;
}

#app-content{
display:none;
}

input,
textarea,
select{
width:100%;
padding:18px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
outline:none;
color:white;
font-family:'Inter';
margin-bottom:15px;
}

textarea{
min-height:180px;
resize:none;
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
color:white;
font-family:'Poppins';
font-weight:600;
font-size:15px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 40px rgba(91,75,255,.35);
}

.btn:hover{
transform:translateY(-3px);
}

.content{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
padding:25px;
border-radius:24px;
margin-top:20px;
}

.content h3{
margin-bottom:15px;
font-size:14px;
font-family:'Poppins';
color:#9b8cff;
text-transform:uppercase;
}

.content p{
line-height:1.8;
color:#d1d5db;
white-space:pre-line;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.tag{
padding:10px 16px;
border-radius:999px;
background:rgba(91,75,255,.12);
border:1px solid rgba(91,75,255,.25);
font-size:13px;
color:#c7c5ff;
}

.export{
margin-top:25px;
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
display:flex;
align-items:center;
justify-content:center;
gap:10px;
font-family:'Poppins';
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<div class="app">

<div class="hero">

<div class="logo">
<i class="fas fa-brain"></i>
</div>

<h1>
Elite <span class="gradient">Docs AI</span>
</h1>

<p>
Crie currículos ATS premium com IA.
</p>

</div>

<div id="login-gate" class="glass">

<div class="login-logo">
<i class="fas fa-bolt"></i>
</div>

<h2 style="font-family:Poppins;margin-bottom:10px;">
Entrar
</h2>

<p style="color:#94a3b8;margin-bottom:25px;">
Faça login para continuar.
</p>

<div id="g_id_onload"
data-client_id="593110663863-u9956693jafabtisfm0jnbgsufjd8n1f.apps.googleusercontent.com"
data-callback="handleCredentialResponse"
data-auto_prompt="false">
</div>

<div class="g_id_signin"
data-type="standard"
data-shape="pill"
data-theme="filled_blue"
data-size="large">
</div>

</div>

<div id="app-content">

<div class="glass">

<select id="tipoDocumento">

<option value="curriculo">
Currículo ATS
</option>

</select>

<input type="text" id="nomePessoa" placeholder="Nome completo">

<input type="text" id="cargoPessoa" placeholder="Cargo profissional">

<input type="text" id="telefonePessoa" placeholder="Telefone">

<input type="email" id="emailPessoa" placeholder="Email">

<input type="text" id="cidadePessoa" placeholder="Cidade">

<input type="file" id="fotoPessoa" accept="image/*">

<textarea
id="rawInput"
placeholder="Fale sobre experiência, habilidades e formação..."></textarea>

<button class="btn" onclick="gerarDocumento()">
Gerar Currículo Premium
</button>

<div id="dashboard"></div>

</div>

</div>

</div>

<script>

window.onload = function(){

const user = localStorage.getItem("eliteUser");

if(user){

const data = JSON.parse(user);

document.getElementById("login-gate").style.display = "none";

document.getElementById("app-content").style.display = "block";

}

}

function handleCredentialResponse(response){

const data = JSON.parse(
atob(response.credential.split('.')[1])
);

localStorage.setItem("eliteUser", JSON.stringify({
name:data.name,
picture:data.picture
}));

document.getElementById("login-gate").style.display = "none";

document.getElementById("app-content").style.display = "block";

}

async function gerarDocumento(){

const input =
document.getElementById('rawInput').value;

const nome =
document.getElementById('nomePessoa').value;

const cargo =
document.getElementById('cargoPessoa').value;

const telefone =
document.getElementById('telefonePessoa').value;

const email =
document.getElementById('emailPessoa').value;

const cidade =
document.getElementById('cidadePessoa').value;

const foto =
document.getElementById('fotoPessoa').files[0];

if(!input){
alert('Digite algo.');
return;
}

const prompt = `
Crie um currículo ATS profissional.

RETORNE:

[RESUMO]
|||
[EXPERIÊNCIA]
|||
[FORMAÇÃO]
|||
[HABILIDADES]

Texto:
${input}
`;

const res = await fetch(
'https://text.pollinations.ai/' + encodeURIComponent(prompt)
);

const text = await res.text();

const partes = text.split("|||");

const resumo = partes[0] || '';
const experiencia = partes[1] || '';
const formacao = partes[2] || '';
const habilidades = partes[3] || '';

let fotoURL = '';

if(foto){
fotoURL = URL.createObjectURL(foto);
}

window.curriculoData = {
nome,
cargo,
telefone,
email,
cidade,
fotoURL,
resumo,
experiencia,
formacao,
habilidades
};

document.getElementById('dashboard').innerHTML = `

<div class="content">

<div style="
display:flex;
gap:25px;
align-items:center;
flex-wrap:wrap;
">

<img
src="${fotoURL}"
style="
width:120px;
height:120px;
border-radius:24px;
object-fit:cover;
border:3px solid #5b4bff;
">

<div>

<h1 style="
font-family:Poppins;
font-size:32px;
margin-bottom:8px;
">
${nome}
</h1>

<p style="color:#9b8cff;font-size:18px;">
${cargo}
</p>

<p style="margin-top:10px;">
📞 ${telefone}
</p>

<p>
✉️ ${email}
</p>

<p>
📍 ${cidade}
</p>

</div>

</div>

</div>

<div class="content">

<h3>Resumo Profissional</h3>

<p>${resumo}</p>

</div>

<div class="content">

<h3>Experiência</h3>

<p>${experiencia}</p>

</div>

<div class="content">

<h3>Formação</h3>

<p>${formacao}</p>

</div>

<div class="content">

<h3>Competências</h3>

<div class="tags">

${habilidades.split(',').map(skill => `
<div class="tag">${skill.trim()}</div>
`).join('')}

</div>

</div>

<div class="export"
onclick="baixarCurriculoPremiumPDF()">

<i class="fas fa-file-pdf"
style="color:#ef4444;"></i>

Baixar Currículo PDF

</div>

`;

}

function baixarCurriculoPremiumPDF(){

const d = window.curriculoData;

const el = document.createElement('div');

el.innerHTML = `

<div style="
padding:40px;
font-family:Arial;
color:#111827;
">

<div style="
display:flex;
gap:25px;
align-items:center;
margin-bottom:35px;
">

<img
src="${d.fotoURL}"
style="
width:120px;
height:120px;
border-radius:20px;
object-fit:cover;
">

<div>

<h1 style="
font-size:34px;
margin-bottom:10px;
color:#4338ca;
">
${d.nome}
</h1>

<h2 style="
font-size:20px;
font-weight:normal;
margin-bottom:10px;
color:#64748b;
">
${d.cargo}
</h2>

<p>📞 ${d.telefone}</p>

<p>✉️ ${d.email}</p>

<p>📍 ${d.cidade}</p>

</div>

</div>

<hr>

<h2>Resumo Profissional</h2>
<p>${d.resumo}</p>

<h2>Experiência</h2>
<p>${d.experiencia}</p>

<h2>Formação</h2>
<p>${d.formacao}</p>

<h2>Competências</h2>
<p>${d.habilidades}</p>

</div>
`;

html2pdf().from(el).save('curriculo-premium.pdf');

}

</script>

</body>
</html>
