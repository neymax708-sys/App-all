<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redator Pro AI + Voz</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5; /* Índigo Moderno */
            --primary-dark: #3730a3;
            --bg: #0f172a; /* Fundo Escuro Sofisticado */
            --card: #1e293b; /* Card levemente mais claro */
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            background-color: var(--card);
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 5px 0 0 0;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            background-color: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        textarea {
            height: 200px;
            resize: none;
            line-height: 1.6;
            padding-right: 50px; /* Espaço para o ícone de voz */
        }

        /* Ícone de Voz dentro da Textarea */
        .voice-btn-inline {
            position: absolute;
            right: 15px;
            bottom: 35px; /* Ajustado para dentro da textarea */
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
            padding: 5px;
        }

        .voice-btn-inline:active { transform: scale(0.9); }
        
        .voice-btn-inline.listening {
            color: var(--error);
            animation: pulse 1.5s infinite;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-magic {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-magic:active { transform: scale(0.98); box-shadow: 0 2px 5px rgba(79, 70, 229, 0.3); }
        .btn-magic:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-pdf {
            background-color: transparent;
            border: 2px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
        }
        
        .btn-pdf:active { background-color: rgba(255,255,255,0.05); color: var(--text-main); }

        .status-bar {
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 5px;
            min-height: 20px;
        }

        .status-bar.success { color: var(--success); }
        .status-bar.error { color: var(--error); }

        /* Área do PDF (Oculta) */
        #pdf-template {
            width: 210mm;
            padding: 60px;
            background: white;
            color: #1f2937;
            position: absolute;
            left: -9999px;
            display: none;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        /* Ajuste para garantir que o PDF seja gerado corretamente */
        body.generating-pdf #pdf-template { display: block; position: static; }
        body.generating-pdf .app-container { display: none; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>Redator Pro AI</h1>
            <p>Fale ou escreva, a IA refina.</p>
        </div>

        <div class="input-group">
            <label>Título do Documento</label>
            <input type="text" id="docTitle" placeholder="Ex: Relatório de Vendas">
        </div>

        <div class="input-group" style="position: relative;">
            <label>Seu Texto ou Ideia</label>
            <textarea id="textContent" placeholder="Digite sua ideia ou clique no microfone para falar..."></textarea>
            <button class="voice-btn-inline" id="voiceBtn" onclick="toggleListening()">
                <i class="fas fa-microphone"></i>
            </button>
        </div>

        <button class="action-btn btn-magic" id="runBtn" onclick="melhorarComIA()">
            <i class="fas fa-sparkles"></i>
            Melhorar com IA
        </button>
        
        <div class="status-bar" id="statusField">Pronto para começar</div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.05); margin: 20px 0;">

        <button class="action-btn btn-pdf" onclick="gerarPDF()">
            <i class="fas fa-file-pdf"></i>
            Baixar PDF Profissional
        </button>
    </div>

    <div id="pdf-template">
        <h1 id="pdfHeader" style="color: #4f46e5; border-bottom: 3px solid #4f46e5; padding-bottom: 15px; text-transform: uppercase; text-align: center; font-size: 28px;"></h1>
        <div id="pdfBody" style="font-size: 18px; line-height: 1.9; color: #374151; margin-top: 35px; white-space: pre-line;"></div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DA IA (Pollinations - Grátis e Fetch Seguro) ---
        async function melhorarComIA() {
            const status = document.getElementById('statusField');
            const field = document.getElementById('textContent');
            const btn = document.getElementById('runBtn');

            const textoOriginal = field.value.trim();
            if(!textoOriginal) return alert("Por favor, forneça um texto ou use o microfone primeiro.");

            try {
                btn.disabled = true;
                status.innerText = "⏳ IA de Elite processando sua ideia...";
                status.className = "status-bar";
                
                // Prompt profissional para extrair o melhor do texto
                const promptComando = "Aja como um redator de elite. Corrija gramática, melhore o vocabulário, elimine redundâncias e reorganize o seguinte texto em português para torná-lo profissional e impactante, mantendo o sentido original: " + textoOriginal;
                
                const response = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptComando));
                
                if (!response.ok) throw new Error("O servidor de IA está ocupado.");

                const textoMelhorado = await response.text();
                field.value = textoMelhorado.trim();
                status.innerText = "✅ Texto transformado profissionalmente!";
                status.className = "status-bar success";

            } catch (error) {
                status.innerText = "❌ Erro na IA. Tente novamente.";
                status.className = "status-bar error";
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        // --- CONFIGURAÇÃO DO PDF (Html2Pdf) ---
        function gerarPDF() {
            const conteudo = document.getElementById('textContent').value;
            const status = document.getElementById('statusField');

            if(!conteudo) return alert("Gere o texto com a IA antes de baixar o PDF.");

            status.innerText = "📥 Preparando seu PDF profissional...";
            
            // Preenche o template
            document.getElementById('pdfHeader').innerText = document.getElementById('docTitle').value.toUpperCase() || "DOCUMENTO PROFISSIONAL AI";
            document.getElementById('pdfBody').innerText = conteudo;

            const element = document.getElementById('pdf-template');
            const opt = {
                margin: 10,
                filename: 'documento_elite.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                status.innerText = "✅ PDF Profissional baixado!";
                status.className = "status-bar success";
            });
        }

        // --- CONFIGURAÇÃO DE VOZ (Speech Recognition Nativo do Chrome Android) ---
        let recognition;
        let isListening = false;
        const voiceBtn = document.getElementById('voiceBtn');
        const textContent = document.getElementById('textContent');
        const statusField = document.getElementById('statusField');

        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false; // Para quando você para de falar
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add('listening');
                voiceBtn.innerHTML = '<i class="fas fa-stop-circle"></i>'; // Ícone de Parar
                statusField.innerText = "🎙️ Ouvindo... Fale agora.";
                statusField.className = "status-bar error"; // Usa cor de destaque
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textContent.value += (textContent.value ? ' ' : '') + transcript; // Adiciona ao texto existente
            };

            recognition.onerror = (event) => {
                console.error("Erro de reconhecimento:", event.error);
                stopListening();
                if(event.error === 'not-allowed') alert("Permissão de microfone negada. Ative nas configurações do Chrome.");
                statusField.innerText = "❌ Erro no microfone.";
            };

            recognition.onend = () => {
                stopListening();
            };
        } else {
            // Se o navegador não suportar
            voiceBtn.style.display = 'none';
            console.error("Navegador não suporta SpeechRecognition.");
            statusField.innerText = "⚠️ Seu navegador não suporta comando de voz.";
        }

        function toggleListening() {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopListening() {
            isListening = false;
            voiceBtn.classList.remove('listening');
            voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>'; // Ícone original
            statusField.innerText = "✅ Voz capturada. Clique em 'Melhorar'.";
            statusField.className = "status-bar success";
        }
    </script>
</body>
</html>
