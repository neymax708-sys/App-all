<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Docs AI</title>

<link rel="icon" type="image/png" href="logo.png">
  
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
background:#050510;
color:white;
padding:12px;
overflow-x:hidden;
background-image:radial-gradient(circle at top, rgba(91,75,255,.18), transparent 35%);
}

.hidden{display:none;}

.container{max-width:700px;margin:auto;}

.hero{text-align:center;padding:25px 10px;}

.logo{width:130px;margin-bottom:15px;}

.hero h1{font-size:34px;font-weight:800;}

.hero p{margin-top:8px;color:#9ca3af;font-size:14px;}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:25px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:22px 10px;
border-radius:24px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.2s;
text-align:center;
min-height:110px;
backdrop-filter:blur(10px);
}

.card:active{transform:scale(.95);}

.card i{font-size:30px;margin-bottom:10px;}

.card span{font-size:12px;font-weight:700;}

.screen{
margin-top:10px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
padding:18px;
border-radius:24px;
backdrop-filter:blur(20px);
}

.back-btn{
background:none;
border:none;
color:#5b4bff;
font-weight:700;
font-size:15px;
margin-bottom:15px;
cursor:pointer;
}

.input,.textarea{
width:100%;
padding:15px;
margin-bottom:12px;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.04);
color:white;
outline:none;
font-size:14px;
}

.textarea{min-height:140px;resize:none;}

.generate-btn{
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
color:white;
font-weight:700;
font-size:14px;
cursor:pointer;
flex:1;
margin-top:10px;
}

.row{display:flex;gap:10px;flex-wrap:wrap;}

.preview-box{
background:white;
color:#222;
padding:18px;
border-radius:18px;
margin-top:18px;
}

</style>

</head>

<body>

<div class="container">

<!-- HOME -->
<div id="homeScreen">

<div class="hero">
<img src="logo.png" class="logo">
<h1>Elite Docs AI</h1>
<p>Documentos com IA + OCR</p>
</div>

<div class="grid">

<div class="card" onclick="abrirTela('curriculoScreen')"><i class="fas fa-user-tie"></i><span>Currículo</span></div>
<div class="card" onclick="abrirTela('pdfScreen')"><i class="fas fa-file-pdf"></i><span>PDF</span></div>
<div class="card" onclick="abrirTela('wordScreen')"><i class="fas fa-file-word"></i><span>Word</span></div>
<div class="card" onclick="abrirTela('excelScreen')"><i class="fas fa-file-excel"></i><span>Excel</span></div>
<div class="card" onclick="abrirTela('pptScreen')"><i class="fas fa-file-powerpoint"></i><span>PPT</span></div>
<div class="card" onclick="abrirTela('txtScreen')"><i class="fas fa-file-lines"></i><span>TXT</span></div>
<div class="card" onclick="abrirTela('linkedinScreen')"><i class="fab fa-linkedin"></i><span>LinkedIn</span></div>
<div class="card" onclick="abrirTela('cartaScreen')"><i class="fas fa-envelope"></i><span>Carta</span></div>
<div class="card" onclick="abrirTela('assinaturaScreen')"><i class="fas fa-signature"></i><span>Assinatura</span></div>

</div>
</div>

<!-- CURRICULO -->
<div id="curriculoScreen" class="screen hidden">
<button class="back-btn" onclick="voltar()">← Voltar</button>

<input class="input" id="nome">
<input class="input" id="cargo">
<input class="input" id="telefone">
<input class="input" id="email">
<input class="input" id="cidade">

<input class="input" type="file" id="fotoCurriculo" accept="image/*">

<textarea class="textarea" id="textoCurriculo"></textarea>

<button class="generate-btn" onclick="ocr('fotoCurriculo','textoCurriculo')">📸 Ler Foto</button>
<button class="generate-btn" onclick="previaCurriculo()">Gerar</button>

<div id="areaPreview" class="hidden"></div>
</div>

<!-- PDF -->
<div id="pdfScreen" class="screen hidden">
<button class="back-btn" onclick="voltar()">← Voltar</button>

<input class="input" id="tituloPDF">
<textarea class="textarea" id="textoPDF"></textarea>

<input class="input" type="file" id="pdfCam" accept="image/*">
<button class="generate-btn" onclick="ocr('pdfCam','textoPDF')">📸 Ler Foto</button>

<button class="generate-btn" onclick="gerarPDFSimples()">PDF</button>
</div>

<!-- WORD -->
<div id="wordScreen" class="screen hidden">
<button class="back-btn" onclick="voltar()">← Voltar</button>

<textarea class="textarea" id="textoWord"></textarea>
<input class="input" type="file" id="wordCam" accept="image/*">

<button class="generate-btn" onclick="ocr('wordCam','textoWord')">📸 Ler Foto</button>
</div>

<!-- EXCEL -->
<div id="excelScreen" class="screen hidden">
<button class="back-btn" onclick="voltar()">← Voltar</button>

<textarea class="textarea" id="textoExcel"></textarea>
<input class="input" type="file" id="excelCam" accept="image/*">

<button class="generate-btn" onclick="ocr('excelCam','textoExcel')">📸 Ler Foto</button>
</div>

<!-- PPT -->
<div id="pptScreen" class="screen hidden">
<button class="back-btn" onclick="voltar()">← Voltar</button>

<textarea class="textarea" id="textoPPT"></textarea>
<input class="input" type="file" id="pptCam" accept="image/*">

<button class="generate-btn" onclick="ocr('pptCam','textoPPT')">📸 Ler Foto</button>
</div>

<!-- TXT -->
<div id="txtScreen" class="screen hidden">
<button class="back-btn" onclick="voltar()">← Voltar</button>

<textarea class="textarea" id="textoTXT"></textarea>
<input class="input" type="file" id="txtCam" accept="image/*">

<button class="generate-btn" onclick="ocr('txtCam','textoTXT')">📸 Ler Foto</button>
</div>

<!-- LINKEDIN -->
<div id="linkedinScreen" class="screen hidden">
<button class="back-btn" onclick="voltar()">← Voltar</button>

<textarea class="textarea" id="textoLinkedin"></textarea>
<input class="input" type="file" id="linkedinCam" accept="image/*">

<button class="generate-btn" onclick="ocr('linkedinCam','textoLinkedin')">📸 Ler Foto</button>
</div>

<!-- CARTA -->
<div id="cartaScreen" class="screen hidden">
<button class="back-btn" onclick="voltar()">← Voltar</button>

<textarea class="textarea" id="textoCarta"></textarea>
<input class="input" type="file" id="cartaCam" accept="image/*">

<button class="generate-btn" onclick="ocr('cartaCam','textoCarta')">📸 Ler Foto</button>
</div>

<!-- ASSINATURA -->
<div id="assinaturaScreen" class="screen hidden">
<button class="back-btn" onclick="voltar()">← Voltar</button>

<input class="input" id="nomeAssinatura">
<input class="input" type="file" id="assinaturaCam" accept="image/*">

<button class="generate-btn" onclick="ocr('assinaturaCam','nomeAssinatura')">📸 Ler Foto</button>
</div>

</div>

<script>

function abrirTela(id){
document.getElementById('homeScreen').classList.add('hidden');
document.getElementById(id).classList.remove('hidden');
}

function voltar(){
document.querySelectorAll('.screen').forEach(e=>e.classList.add('hidden'));
document.getElementById('homeScreen').classList.remove('hidden');
}

/* OCR UNIVERSAL */
async function ocr(fileId,targetId){

const file=document.getElementById(fileId).files[0];
if(!file)return;

document.getElementById(targetId).value="Lendo...";

const result=await Tesseract.recognize(file,'por');

document.getElementById(targetId).value=result.data.text;

}

/* PDF */
function gerarPDFSimples(){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
pdf.text(document.getElementById('textoPDF').value,10,10);
pdf.save("arquivo.pdf");
}

/* CURRICULO PREVIEW */
function previaCurriculo(){

document.getElementById('areaPreview').classList.remove('hidden');

document.getElementById('areaPreview').innerHTML=`
<div class="preview-box">
<h2>${document.getElementById('nome').value}</h2>
<p>${document.getElementById('textoCurriculo').value}</p>
</div>`;
}

</script>

</body>
</html>
