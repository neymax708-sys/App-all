<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite AI Workspace v7</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        * { box-sizing: border-box; transition: 0.3s ease; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        header { background: var(--card); padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top:0; z-index:100; }
        header h1 { font-size: 22px; margin: 0; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); }

        label { display: block; font-size: 11px; font-weight: 800; color: #6366f1; text-transform: uppercase; margin-bottom: 8px; }
        input, textarea { width: 100%; background: rgba(15,23,42,0.6); border: 1px solid #334155; border-radius: 15px; color: white; padding: 15px; font-size: 16px; margin-bottom: 20px; }
        textarea { height: 220px; resize: none; }

        .mic-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #334155; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: -75px 10px 25px auto; position: relative; z-index: 10; }
        .mic-active { background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }

        .btn-action { width: 100%; border: none; padding: 18px; border-radius: 16px; font-weight: 700; cursor: pointer; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-ai { background: var(--primary); color: white; }
        .btn-view { background: #10b981; color: white; }

        /* VISUALIZADOR INTERNO (WORKSPACE) */
        #workspace { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f1f5f9; z-index: 200; display: none; overflow-y: auto; }
        .toolbar { background: #1e293b; padding: 15px; display: flex; justify-content: space-between; position: sticky; top: 0; }
        .tool-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        
        .paper { background: white; width: 90%; max-width: 800px; min-height: 1100px; margin: 30px auto; padding: 60px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); color: #1e293b; }
        .paper h2 { color: #4f46e5; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; font-family: 'Times New Roman', serif; }
        .paper p { font-family: 'Times New Roman', serif; font-size: 18px; line-height: 1.8; white-space: pre-line; }

        #status { text-align: center; font-size: 12px; color: #818cf8; font-weight: 600; }
    </style>
</head>
<body>

    <header><h1>Elite AI Workspace</h1></header>

    <div class="container" id="main-ui">
        <div class="card">
            <label>Título do Projeto</label>
            <input type="text" id="docTitle" placeholder="Ex: Relatório Financeiro">
            
            <label>Conteúdo / Dados</label>
            <textarea id="textContent" placeholder="Fale ou digite aqui os dados ou o texto..."></textarea>
            
            <button class="mic-btn" id="micBtn" onclick="handleMic()">
                <i class="fas fa-microphone" id="micIcon"></i>
            </button>

            <button class="btn-action btn-ai" onclick="runAI()">
                <i class="fas fa-wand-magic-sparkles"></i> Refinar com IA
            </button>
            
            <button class="btn-action btn-view" onclick="showWorkspace()">
                <i class="fas fa-file-invoice"></i> Visualizar Documento
            </button>
            <p id="status">Sistema Pronto</p>
        </div>
    </div>

    <div id="workspace">
        <div class="toolbar">
            <button class="tool-btn" style="background:#ef4444" onclick="hideWorkspace()"><i class="fas fa-times"></i> Fechar</button>
            <div style="display:flex; gap:8px;">
                <button class="tool-btn" onclick="exportDoc('pdf')"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="tool-btn" onclick="exportDoc('xlsx')"><i class="fas fa-file-excel"></i> EXCEL</button>
                <button class="tool-btn" onclick="exportDoc('doc')"><i class="fas fa-file-word"></i> DOC</button>
            </div>
        </div>

        <div class="paper" id="paper-area">
            <h2 id="viewTitle"></h2>
            <p id="viewBody"></p>
        </div>
    </div>

    <script>
        // Config de Voz
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'pt-BR';
        let isMicOn = false;

        function handleMic() {
            const btn = document.getElementById('micBtn');
            const icon = document.getElementById('micIcon');
            if(!isMicOn) {
                recognition.start();
                btn.classList.add('mic-active');
                icon.className = "fas fa-stop";
            } else {
                recognition.stop();
                btn.classList.remove('mic-active');
                icon.className = "fas fa-microphone";
            }
            isMicOn = !isMicOn;
        }

        recognition.onresult = (e) => {
            document.getElementById('textContent').value += " " + e.results[0][0].transcript;
            handleMic();
        };

        // Workspace
        function showWorkspace() {
            document.getElementById('viewTitle').innerText = document.getElementById('docTitle').value || "Documento Elite";
            document.getElementById('viewBody').innerText = document.getElementById('textContent').value || "Sem conteúdo.";
            document.getElementById('workspace').style.display = 'block';
        }

        function hideWorkspace() { document.getElementById('workspace').style.display = 'none'; }

        // IA
        async function runAI() {
            const field = document.getElementById('textContent');
            const status = document.getElementById('status');
            if(!field.value) return;

            status.innerText = "⏳ IA Estruturando Arquivos...";
            const prompt = "Reorganize o conteúdo a seguir de forma extremamente profissional. Se parecerem dados de tabela, separe por vírgulas. Se for texto, use linguagem corporativa sênior: " + field.value;
            
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                field.value = await res.text();
                status.innerText = "✅ Conteúdo Otimizado!";
            } catch (e) { status.innerText = "❌ Erro na IA."; }
        }

        // EXPORTAÇÃO PROFISSIONAL
        function exportDoc(type) {
            const title = document.getElementById('docTitle').value || "Doc_Elite";
            const content = document.getElementById('textContent').value;

            if(type === 'pdf') {
                const element = document.getElementById('paper-area');
                html2pdf().set({ margin: 1, filename: title+'.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } }).from(element).save();
            } 
            else if(type === 'xlsx') {
                // Transforma texto em Planilha Real (XLSX)
                const rows = content.split('\n').map(line => line.split(/[,;|]/).map(item => item.trim()));
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(rows);
                XLSX.utils.book_append_sheet(wb, ws, "Dados Elite");
                XLSX.writeFile(wb, `${title}.xlsx`);
            }
            else if(type === 'doc') {
                const blob = new Blob(['\ufeff', document.getElementById('paper-area').innerHTML], { type: 'application/msword' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${title}.doc`;
                link.click();
            }
        }
    </script>
</body>
</html>
