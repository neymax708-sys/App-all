<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI | Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg: #070b14; --card: #111827; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #f9fafb; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        #login-gate { text-align: center; width: 100%; max-width: 400px; padding: 20px; }
        .card { background: var(--card); padding: 40px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        #app-content { display: none; width: 100%; max-width: 550px; padding: 20px; }
        input, textarea { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 15px; color: white; padding: 15px; margin-bottom: 15px; outline: none; }
        .btn { width: 100%; background: var(--primary); border: none; padding: 18px; border-radius: 15px; color: white; font-weight: 700; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div id="login-gate">
        <div class="card">
            <i class="fas fa-crown" style="font-size: 40px; color: var(--primary); margin-bottom: 20px;"></i>
            <h1>Elite Docs AI</h1>
            <p style="color: #94a3b8; margin-bottom: 30px;">Acesse para criar seus documentos.</p>
            
            <div id="g_id_onload"
                 data-client_id="593110663863-u9956693jafabtisfm0jnbgsufjd8n1f.apps.googleusercontent.com"
                 data-callback="onSuccess"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue" data-size="large"></div>
        </div>
    </div>

    <div id="app-content">
        <div style="background: var(--card); padding: 30px; border-radius: 30px;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                <img id="uPic" src="" style="width: 30px; border-radius: 50%;">
                <span id="uName" style="font-size: 12px; font-weight: 800;"></span>
            </div>
            <input type="text" id="titulo" placeholder="Título do Documento">
            <textarea id="texto" placeholder="Escreva sua ideia aqui..." style="height: 250px;"></textarea>
            <button class="btn" onclick="gerar()">Refinar com IA</button>
            <button class="btn" style="background: #10b981; margin-top: 10px;" onclick="baixar()">Baixar PDF</button>
        </div>
    </div>

    <script>
        function onSuccess(response) {
            const user = JSON.parse(atob(response.credential.split('.')[1]));
            document.getElementById('login-gate').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('uPic').src = user.picture;
            document.getElementById('uName').innerText = user.name.toUpperCase();
        }

        async function gerar() {
            const t = document.getElementById('texto');
            if(!t.value) return;
            t.value = "IA trabalhando...";
            const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Transforme em um texto profissional: " + t.value)}`);
            t.value = await res.text();
        }

        function baixar() {
            const el = document.createElement('div');
            el.style.padding = "40px";
            el.innerHTML = `<h1>${document.getElementById('titulo').value}</h1><p style="white-space:pre-line">${document.getElementById('texto').value}</p>`;
            html2pdf().from(el).save('Elite_Doc.pdf');
        }
    </script>
</body>
</html>
