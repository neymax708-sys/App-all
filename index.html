<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite AI Workspace v5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-shell { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Sistema de Abas */
        .tabs { display: flex; background: var(--card); border-radius: 12px; padding: 5px; margin-bottom: 5px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; color: #94a3b8; font-weight: 700; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; }

        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* Tela de Edição */
        #editor-view { display: flex; flex-direction: column; }
        input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: white; padding: 15px; font-size: 16px; margin-bottom: 15px; }
        textarea { height: 250px; resize: none; }

        /* Tela de Visualização (O "Próprio App" abrindo o doc) */
        #preview-view { display: none; }
        .document-paper { background: white; color: #1f2937; padding: 30px; border-radius: 4px; min-height: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow-y: auto; }
        .document-paper h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; color: var(--primary); margin-top: 0; }
        .document-paper p { line-height: 1.6; white-space: pre-line; }

        /* Botões */
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .mic-btn { background: #334155; color: white; width: 50px; height: 50px; border-radius: 50%; border: none; margin: -70px 10px 20px auto; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
        .mic-active { background: #ef4444; animation: pulse 1.5s infinite; }

        .grid-export { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .export-item { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; font-size: 11px; }
        .export-item i { display: block; font-size: 20px; margin-bottom: 5px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('edit')">EDITAR</button>
            <button class="tab-btn" onclick="switchTab('preview')">VER DOCUMENTO</button>
        </div>

        <div id="editor-view">
            <div class="card">
                <label style="font-size: 11px; color: #94a3b8; font-weight: 700;">TÍTULO</label>
                <input type="text" id="docTitle" placeholder="Ex: Contrato de Serviço">
                
                <label style="font-size: 11px; color: #94a3b8; font-weight: 700;">TEXTO</label>
                <textarea id="textContent" placeholder="Sua ideia aqui..."></textarea>
                
                <button class="mic-btn" id="micBtn" onclick="toggleMic()">
                    <i class="fas fa-microphone" id="micIcon"></i>
                </button>

                <button class="btn-main" onclick="processAI()">
                    <i class="fas fa-wand-magic-sparkles"></i> Refinar com IA
                </button>
                <div id="status" style="text-align: center; font-size: 12px; color: #10b981;">Pronto</div>
            </div>
        </div>

        <div id="preview-view">
            <div class="document-paper" id="paper">
                <h2 id="viewTitle">Título do Documento</h2>
                <p id="viewBody">O conteúdo aparecerá aqui...</p>
            </div>

            <div class="grid-export">
                <div class="export-item" onclick="download('pdf')"><i class="fas fa-file-pdf" style="color:#f87171"></i>PDF</div>
                <div class="export-item" onclick="download('doc')"><i class="fas fa-file-word" style="color:#60a5fa"></i>WORD</div>
                <div class="export-item" onclick="download('xls')"><i class="fas fa-file-excel" style="color:#34d399"></i>EXCEL</div>
            </div>
        </div>
    </div>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'pt-BR';
        let listening = false;

        function switchTab(type) {
            const edit = document.getElementById('editor-view');
            const preview = document.getElementById('preview-view');
            const btns = document.querySelectorAll('.tab-btn');

            if(type === 'edit') {
                edit.style.display = 'block';
                preview.style.display = 'none';
                btns[0].classList.add('active');
                btns[1].classList.remove('active');
            } else {
                edit.style.display = 'none';
                preview.style.display = 'block';
                btns[1].classList.add('active');
                btns[0].classList.remove('active');
                updatePreview();
            }
        }

        function updatePreview() {
            document.getElementById('viewTitle').innerText = document.getElementById('docTitle').value || "Documento Sem Título";
            document.getElementById('viewBody').innerText = document.getElementById('textContent').value || "Nenhum conteúdo gerado.";
        }

        function toggleMic() {
            const icon = document.getElementById('micIcon');
            const btn = document.getElementById('micBtn');
            if(!listening) {
                recognition.start();
                btn.classList.add('mic-active');
                icon.className = "fas fa-stop";
                listening = true;
            } else {
                recognition.stop();
                btn.classList.remove('mic-active');
                icon.className = "fas fa-microphone";
                listening = false;
            }
        }

        recognition.onresult = (e) => {
            document.getElementById('textContent').value += " " + e.results[0][0].transcript;
            toggleMic();
        };

        async function processAI() {
            const text = document.getElementById('textContent');
            const status = document.getElementById('status');
            if(!text.value) return;

            status.innerText = "⏳ IA Trabalhando...";
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Transforme em um texto profissional e elegante em português: " + text.value)}`);
                text.value = await res.text();
                status.innerText = "✅ Refinado!";
                updatePreview();
            } catch (e) { status.innerText = "❌ Erro de conexão."; }
        }

        function download(type) {
            const title = document.getElementById('docTitle').value || "Elite_Doc";
            const content = document.getElementById('textContent').value;

            if(type === 'pdf') {
                html2pdf().from(document.getElementById('paper')).save(`${title}.pdf`);
            } else if(type === 'doc') {
                const blob = new Blob(['\ufeff', document.getElementById('paper').innerHTML], { type: 'application/msword' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${title}.doc`;
                link.click();
            } else if(type === 'xls') {
                const csv = "data:text/csv;charset=utf-8,\ufeff" + content.split('\n').map(l => `"${l}"`).join("\n");
                const link = document.createElement('a');
                link.href = encodeURI(csv);
                link.download = `${title}.csv`;
                link.click();
            }
        }
    </script>
</body>
</html>
