<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI | Login</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

        /* TELA DE LOGIN ÚNICA */
        #login-overlay { text-align: center; width: 100%; max-width: 420px; padding: 20px; }
        .login-card { background: var(--card); padding: 50px 30px; border-radius: 40px; box-shadow: 0 40px 80px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); }
        .logo-sphere { background: var(--primary); width: 80px; height: 80px; border-radius: 25px; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; font-size: 35px; box-shadow: 0 15px 30px rgba(79, 70, 229, 0.4); }

        /* APLICATIVO (BLOQUEADO ATÉ O LOGIN) */
        #app-interface { display: none; width: 100%; max-width: 550px; padding: 20px; animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .editor { background: var(--card); border-radius: 32px; padding: 35px; border: 1px solid rgba(255,255,255,0.05); }
        .user-tag { display: flex; align-items: center; gap: 12px; background: rgba(79, 70, 229, 0.15); padding: 8px 20px; border-radius: 100px; width: fit-content; margin-bottom: 30px; border: 1px solid var(--primary); }
        .user-tag img { width: 28px; height: 28px; border-radius: 50%; }

        textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 20px; color: white; padding: 20px; font-size: 16px; min-height: 280px; margin-top: 15px; outline: none; }
        textarea:focus { border-color: var(--primary); }
        
        .action-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 22px; border-radius: 22px; font-weight: 800; cursor: pointer; margin-top: 15px; font-size: 16px; transition: 0.2s; }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <div class="logo-sphere"><i class="fas fa-shield-halved"></i></div>
            <h1 style="font-size: 30px; margin-bottom: 10px;">Elite Docs AI</h1>
            <p style="color: #94a3b8; margin-bottom: 40px;">Conecte sua conta para acessar o gerador de documentos.</p>
            
            <div id="g_id_onload"
                 data-client_id="COLE_AQUI_SEU_CLIENT_ID_REAL.apps.googleusercontent.com"
                 data-callback="onSuccess"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue" data-size="large"></div>
        </div>
    </div>

    <div id="app-interface">
        <div class="user-tag">
            <img id="avatar" src="" alt="">
            <span id="userName" style="font-size: 13px; font-weight: 700;"></span>
        </div>

        <div class="editor">
            <h2 style="margin: 0 0 20px 0;">Painel de Criação</h2>
            <input type="text" id="titulo" placeholder="Título do Documento Profissional" style="width:100%; padding:18px; border-radius:18px; background:#0f172a; border:1px solid #334155; color:white; font-size:16px;">
            <textarea id="texto" placeholder="Fale ou escreva sua ideia..."></textarea>
            
            <button class="action-btn" onclick="melhorarIA()">
                <i class="fas fa-sparkles"></i> Transformar com IA Elite
            </button>
            <button class="action-btn" style="background:#10b981" onclick="baixar()">
                <i class="fas fa-file-pdf"></i> Finalizar e Baixar PDF
            </button>
        </div>
    </div>

    <script>
        function onSuccess(response) {
            const user = JSON.parse(atob(response.credential.split('.')[1]));
            
            // Troca de Telas: Esconde Login, Mostra App
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-interface').style.display = 'block';
            document.body.style.alignItems = 'flex-start';

            // Dados do Usuário
            document.getElementById('avatar').src = user.picture;
            document.getElementById('userName').innerText = user.name.toUpperCase();
        }

        async function melhorarIA() {
            const t = document.getElementById('texto');
            if(!t.value) return;
            const original = t.value;
            t.value = "Processando sua ideia...";
            
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Resuma e formate este texto de forma executiva e profissional em português: " + original)}`);
                t.value = await res.text();
            } catch (e) { t.value = original; alert("Erro na conexão"); }
        }

        function baixar() {
            const el = document.createElement('div');
            el.style.padding = "50px";
            el.innerHTML = `<h1 style="border-bottom:2px solid #4f46e5; padding-bottom:10px">${document.getElementById('titulo').value}</h1>
                           <p style="white-space:pre-line; line-height:1.6; font-size:18px">${document.getElementById('texto').value}</p>`;
            
            html2pdf().from(el).set({ margin: 1, filename: 'Documento_Elite.pdf' }).save();
        }
    </script>
</body>
</html>
