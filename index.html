<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Docs AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top, rgba(91,75,255,.25), transparent 35%),
linear-gradient(180deg,#050510,#0b1020);
color:white;
padding:12px;
overflow-x:hidden;
animation:bgMove 8s infinite alternate;
}

@keyframes bgMove{
0%{
background-position:top;
}
100%{
background-position:bottom;
}
}

.hidden{
display:none;
}

.container{
max-width:700px;
margin:auto;
}

.hero{
text-align:center;
padding:25px 10px;
}

.logo{
width:120px;
margin-bottom:15px;
}

.hero h1{
font-size:34px;
font-weight:800;
}

.hero p{
margin-top:8px;
color:#9ca3af;
font-size:14px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:25px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:22px 10px;
border-radius:24px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.25s;
text-align:center;
min-height:110px;
backdrop-filter:blur(14px);
box-shadow:0 0 20px rgba(91,75,255,.08);
position:relative;
overflow:hidden;
}

.card::before{
content:'';
position:absolute;
width:120px;
height:120px;
background:rgba(255,255,255,.05);
border-radius:50%;
top:-40px;
right:-40px;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 30px rgba(91,75,255,.25);
}

.card:active{
transform:scale(.96);
}

.card i{
font-size:30px;
margin-bottom:10px;
}

.card span{
font-size:12px;
font-weight:700;
}

.screen{
margin-top:10px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:18px;
border-radius:24px;
backdrop-filter:blur(25px);
animation:fade .35s ease;
box-shadow:0 0 30px rgba(0,0,0,.25);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.back-btn{
background:none;
border:none;
color:#5b4bff;
font-weight:700;
font-size:15px;
margin-bottom:15px;
cursor:pointer;
}

.input,
.textarea{
width:100%;
padding:15px;
margin-bottom:12px;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.05);
color:white;
outline:none;
font-size:14px;
transition:.25s;
}

.input:focus,
.textarea:focus{
border:1px solid #5b4bff;
box-shadow:0 0 15px rgba(91,75,255,.35);
}

.textarea{
min-height:140px;
resize:none;
}

.generate-btn{
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
color:white;
font-weight:700;
font-size:14px;
cursor:pointer;
flex:1;
transition:.25s;
box-shadow:0 0 20px rgba(91,75,255,.25);
}

.generate-btn:hover{
transform:translateY(-2px);
box-shadow:0 0 35px rgba(91,75,255,.45);
}

.row{
display:flex;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap;
}

.loading{
display:flex;
align-items:center;
gap:10px;
margin-top:15px;
font-size:14px;
color:#a5b4fc;
}

.spinner{
width:18px;
height:18px;
border:3px solid rgba(255,255,255,.2);
border-top:3px solid #5b4bff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

@media(max-width:650px){
.grid{
grid-template-columns:repeat(3,1fr);
}
}

</style>

</head>

<body>

<div class="container">

<div id="homeScreen">

<div class="hero">

<h1>Elite Docs AI</h1>

<p>Currículos, PDFs e documentos premium</p>

</div>

<div class="grid">

<div class="card" onclick="abrirTela('pdfScreen')">
<i class="fas fa-file-pdf" style="color:#ef4444"></i>
<span>PDF</span>
</div>

<div class="card" onclick="abrirTela('wordScreen')">
<i class="fas fa-file-word" style="color:#2b579a"></i>
<span>Word</span>
</div>

<div class="card" onclick="abrirTela('txtScreen')">
<i class="fas fa-file-lines" style="color:#9ca3af"></i>
<span>TXT</span>
</div>

</div>

</div>

<!-- PDF -->

<div id="pdfScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">
← Voltar
</button>

<input class="input" id="tituloPDF" placeholder="Título">

<textarea class="textarea" id="textoPDF" placeholder="Digite o conteúdo..."></textarea>

<input
class="input"
type="file"
id="pdfCamera"
accept="image/*"
capture="environment">

<button
class="generate-btn"
style="background:#f59e0b;"
onclick="lerImagemPDF()">

📸 Escanear Documento

</button>

<button class="generate-btn" onclick="gerarPDFSimples()">
Gerar PDF
</button>

</div>

<!-- WORD -->

<div id="wordScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">
← Voltar
</button>

<input class="input" id="tituloWord" placeholder="Título">

<textarea class="textarea" id="textoWord" placeholder="Digite o conteúdo..."></textarea>

<input
class="input"
type="file"
id="wordCamera"
accept="image/*"
capture="environment">

<button
class="generate-btn"
style="background:#f59e0b;"
onclick="lerImagemWord()">

📸 Escanear Texto

</button>

<button class="generate-btn" onclick="baixarWord()">
Baixar Word
</button>

</div>

<!-- TXT -->

<div id="txtScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">
← Voltar
</button>

<textarea class="textarea" id="textoTXT" placeholder="Digite qualquer texto"></textarea>

<input
class="input"
type="file"
id="txtCamera"
accept="image/*"
capture="environment">

<button
class="generate-btn"
style="background:#f59e0b;"
onclick="lerImagemTXT()">

📸 Ler Imagem

</button>

<button class="generate-btn" onclick="baixarTXT()">
Baixar TXT
</button>

</div>

<div id="loadingIA" class="loading hidden">

<div class="spinner"></div>

<span>IA analisando documento...</span>

</div>

</div>

<script>

function abrirTela(id){

document.getElementById('homeScreen').classList.add('hidden');

document.querySelectorAll('.screen').forEach(s=>{
s.classList.add('hidden');
});

document.getElementById(id).classList.remove('hidden');

}

function voltar(){

document.querySelectorAll('.screen').forEach(s=>{
s.classList.add('hidden');
});

document.getElementById('homeScreen').classList.remove('hidden');

}

/* PDF */

function gerarPDFSimples(){

const { jsPDF } = window.jspdf;

const pdf = new jsPDF();

const titulo =
document.getElementById('tituloPDF').value;

const texto =
document.getElementById('textoPDF').value;

pdf.setFontSize(22);

pdf.text(titulo,20,30);

const linhas =
pdf.splitTextToSize(texto,170);

pdf.setFontSize(12);

pdf.text(linhas,20,50);

pdf.save("documento.pdf");

}

/* WORD */

function baixarWord(){

const titulo =
document.getElementById('tituloWord').value;

const texto =
document.getElementById('textoWord').value;

const blob = new Blob(
[`${titulo}\n\n${texto}`],
{
type:"application/msword"
}
);

const a =
document.createElement('a');

a.href =
URL.createObjectURL(blob);

a.download = "documento.doc";

a.click();

}

/* TXT */

function baixarTXT(){

const texto =
document.getElementById('textoTXT').value;

const blob = new Blob(
[texto],
{
type:'text/plain'
}
);

const a =
document.createElement('a');

a.href =
URL.createObjectURL(blob);

a.download = "arquivo.txt";

a.click();

}

/* OCR PDF */

async function lerImagemPDF(){

const file =
document.getElementById(
'pdfCamera'
).files[0];

if(!file){
alert("Escolha uma imagem");
return;
}

document.getElementById(
'textoPDF'
).value = "Lendo imagem...";

const result =
await Tesseract.recognize(
file,
'por'
);

document.getElementById(
'textoPDF'
).value =
result.data.text;

}

/* OCR WORD */

async function lerImagemWord(){

const file =
document.getElementById(
'wordCamera'
).files[0];

if(!file){
alert("Escolha uma imagem");
return;
}

document.getElementById(
'textoWord'
).value = "Lendo imagem...";

const result =
await Tesseract.recognize(
file,
'por'
);

document.getElementById(
'textoWord'
).value =
result.data.text;

}

/* OCR TXT */

async function lerImagemTXT(){

const file =
document.getElementById(
'txtCamera'
).files[0];

if(!file){
alert("Escolha uma imagem");
return;
}

document.getElementById(
'textoTXT'
).value = "Lendo imagem...";

const result =
await Tesseract.recognize(
file,
'por'
);

document.getElementById(
'textoTXT'
).value =
result.data.text;

}

</script>

</body>
</html>
