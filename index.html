<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Docs AI</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--primary:#5b4bff;
--secondary:#4338ca;
--glass:rgba(18,20,40,.55);
--border:rgba(255,255,255,.08);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#05050a;
background-image:
radial-gradient(circle at top, rgba(91,75,255,.25), transparent 35%),
radial-gradient(circle at bottom, rgba(67,56,202,.15), transparent 30%);
color:white;
min-height:100vh;
padding:20px;
overflow-x:hidden;
}

.app{
max-width:1100px;
margin:auto;
}

.hero{
text-align:center;
margin-bottom:35px;
}

.logo{
width:120px;
height:120px;
margin:auto;
border-radius:35px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
box-shadow:0 0 60px rgba(91,75,255,.45);
margin-bottom:25px;
}

.hero h1{
font-family:'Poppins';
font-size:52px;
margin-bottom:10px;
}

.gradient{
background:linear-gradient(90deg,#fff,#9b8cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
color:#94a3b8;
max-width:700px;
margin:auto;
line-height:1.8;
}

.glass{
background:var(--glass);
border:1px solid var(--border);
backdrop-filter:blur(18px);
border-radius:30px;
padding:30px;
box-shadow:0 20px 60px rgba(0,0,0,.4);
}

#login-gate{
max-width:420px;
margin:40px auto;
text-align:center;
}

.login-logo{
width:90px;
height:90px;
margin:auto;
border-radius:25px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
margin-bottom:20px;
}

#app-content{
display:none;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}

.card{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
padding:25px;
border-radius:24px;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
border:1px solid #5b4bff;
background:rgba(91,75,255,.08);
}

.card i{
font-size:34px;
margin-bottom:18px;
}

.card h2{
font-size:20px;
margin-bottom:10px;
font-family:'Poppins';
}

.card p{
color:#94a3b8;
line-height:1.6;
font-size:14px;
}

input,
textarea{
width:100%;
padding:18px;
margin-bottom:15px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
color:white;
font-family:'Inter';
outline:none;
}

textarea{
min-height:180px;
resize:none;
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#5b4bff,#4338ca);
color:white;
font-family:'Poppins';
font-weight:600;
cursor:pointer;
font-size:15px;
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}

.content{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
padding:25px;
border-radius:24px;
margin-top:20px;
}

.export{
margin-top:15px;
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
display:flex;
align-items:center;
justify-content:center;
gap:10px;
font-family:'Poppins';
cursor:pointer;
}

.hidden{
display:none;
}

@media(max-width:800px){

.grid{
grid-template-columns:1fr;
}

.hero h1{
font-size:36px;
}

}

</style>

</head>

<body>

<div class="app">

<div class="hero">

<div class="logo">
<i class="fas fa-brain"></i>
</div>

<h1>
Elite <span class="gradient">Docs AI</span>
</h1>

<p>
Currículos ATS, PDFs, LinkedIn e cartas profissionais com IA.
</p>

</div>

<div id="login-gate" class="glass">

<div class="login-logo">
<i class="fas fa-bolt"></i>
</div>

<h2 style="margin-bottom:10px;font-family:Poppins;">
Entrar
</h2>

<p style="color:#94a3b8;margin-bottom:25px;">
Faça login para continuar.
</p>

<div id="g_id_onload"
data-client_id="593110663863-u9956693jafabtisfm0jnbgsufjd8n1f.apps.googleusercontent.com"
data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"
data-type="standard"
data-theme="filled_blue"
data-size="large"
data-shape="pill">
</div>

</div>

<div id="app-content">

<div class="glass">

<div class="grid">

<div class="card" onclick="abrirFormulario('curriculo')">

<i class="fas fa-user-tie" style="color:#5b4bff;"></i>

<h2>Currículo ATS</h2>

<p>
Currículo premium com IA.
</p>

</div>

</div>

<div id="form-curriculo" class="hidden">

<div class="content">

<h3 style="margin-bottom:20px;color:#9b8cff;">
Informações do Currículo
</h3>

<input type="text" id="nome" placeholder="Nome completo">

<input type="text" id="cargo" placeholder="Cargo profissional">

<input type="text" id="telefone" placeholder="Telefone">

<input type="email" id="email" placeholder="Email">

<input type="text" id="cidade" placeholder="Cidade">

<input type="file" id="foto" accept="image/*">

<textarea id="textoCurriculo" placeholder="Experiências, habilidades e formação..."></textarea>

<button class="btn" onclick="previewCurriculo()">
Analisar Currículo
</button>

<div id="previewCurriculo"></div>

</div>

</div>

</div>

</div>

</div>

<script>

window.onload = function(){

const user = localStorage.getItem("eliteUser");

if(user){

document.getElementById("login-gate").style.display="none";

document.getElementById("app-content").style.display="block";

}

}

function handleCredentialResponse(response){

const data = JSON.parse(atob(response.credential.split('.')[1]));

localStorage.setItem("eliteUser", JSON.stringify(data));

document.getElementById("login-gate").style.display="none";

document.getElementById("app-content").style.display="block";

}

function abrirFormulario(tipo){

document.getElementById("form-curriculo").classList.remove("hidden");

}

async function previewCurriculo(){

const texto = document.getElementById("textoCurriculo").value;

const prompt = `
Crie currículo ATS premium.

RETORNE:

[RESUMO]
|||
[EXPERIÊNCIA]
|||
[FORMAÇÃO]
|||
[HABILIDADES]

Texto:
${texto}
`;

const res = await fetch(
'https://text.pollinations.ai/' + encodeURIComponent(prompt)
);

const data = await res.text();

const partes = data.split("|||");

const resumo = partes[0] || '';
const experiencia = partes[1] || '';
const formacao = partes[2] || '';
const habilidades = partes[3] || '';

const foto = document.getElementById("foto").files[0];

let fotoURL = '';

if(foto){
fotoURL = URL.createObjectURL(foto);
}else{
fotoURL = 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
}

document.getElementById("previewCurriculo").innerHTML = `

<div id="curriculoPDF" style="
background:white;
color:#222;
border-radius:25px;
overflow:hidden;
margin-top:25px;
box-shadow:0 20px 60px rgba(0,0,0,.4);
font-family:Arial;
">

<div style="display:flex;flex-wrap:wrap;">

<div style="
width:280px;
background:#005fcc;
color:white;
padding:30px 20px;
">

<div style="text-align:center;margin-bottom:25px;">

<img
src="${fotoURL}"
style="
width:130px;
height:130px;
border-radius:20px;
object-fit:cover;
border:4px solid white;
background:white;
">

</div>

<h2 style="
font-size:22px;
margin-bottom:25px;
text-align:center;
line-height:1.3;
font-weight:bold;
">
${document.getElementById("nome").value}
</h2>

<div style="margin-bottom:30px;">

<h3 style="
font-size:16px;
margin-bottom:15px;
border-bottom:1px solid rgba(255,255,255,.4);
padding-bottom:8px;
">
CONTATO
</h3>

<p style="margin-bottom:10px;">
📞 ${document.getElementById("telefone").value}
</p>

<p style="margin-bottom:10px;">
✉️ ${document.getElementById("email").value}
</p>

<p style="margin-bottom:10px;">
📍 ${document.getElementById("cidade").value}
</p>

</div>

<div style="margin-bottom:30px;">

<h3 style="
font-size:16px;
margin-bottom:15px;
border-bottom:1px solid rgba(255,255,255,.4);
padding-bottom:8px;
">
HABILIDADES
</h3>

${habilidades.split(',').map(skill=>`
<p style="
margin-bottom:10px;
font-size:14px;
">
• ${skill.trim()}
</p>
`).join('')}

</div>

</div>

<div style="
flex:1;
padding:40px 35px;
min-width:300px;
">

<h1 style="
font-size:42px;
color:#005fcc;
font-weight:900;
line-height:1.1;
margin-bottom:8px;
font-family:Poppins;
">
${document.getElementById("nome").value}
</h1>

<p style="
font-size:20px;
color:#555;
margin-bottom:30px;
">
${document.getElementById("cargo").value}
</p>

<h3 style="
color:#005fcc;
font-size:18px;
margin-bottom:15px;
border-bottom:2px solid #dbeafe;
padding-bottom:8px;
">
RESUMO PROFISSIONAL
</h3>

<p style="
line-height:1.8;
margin-bottom:30px;
color:#444;
">
${resumo}
</p>

<h3 style="
color:#005fcc;
font-size:18px;
margin-bottom:15px;
border-bottom:2px solid #dbeafe;
padding-bottom:8px;
">
EXPERIÊNCIA
</h3>

<p style="
line-height:1.8;
margin-bottom:30px;
color:#444;
white-space:pre-line;
">
${experiencia}
</p>

<h3 style="
color:#005fcc;
font-size:18px;
margin-bottom:15px;
border-bottom:2px solid #dbeafe;
padding-bottom:8px;
">
FORMAÇÃO
</h3>

<p style="
line-height:1.8;
margin-bottom:30px;
color:#444;
white-space:pre-line;
">
${formacao}
</p>

</div>

</div>

</div>

<div class="export" onclick="baixarCurriculoPDF()">

<i class="fas fa-file-pdf" style="color:#ef4444;"></i>

Baixar Currículo PDF

</div>

`;

}

function baixarCurriculoPDF(){

const el = document.getElementById("curriculoPDF");

html2pdf().set({

margin:0,
filename:'curriculo-premium.pdf',
image:{ type:'jpeg', quality:1 },
html2canvas:{ scale:2 },
jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' }

}).from(el).save();

}

</script>

</body>
</html>
