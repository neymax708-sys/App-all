<!-- ========= ADICIONE ESSES CARDS NO GRID ========= -->

<div class="card" onclick="abrirTela('wordScreen')">
<i class="fas fa-file-word" style="color:#2b579a"></i>
<span>Word</span>
</div>

<div class="card" onclick="abrirTela('excelScreen')">
<i class="fas fa-file-excel" style="color:#217346"></i>
<span>Excel</span>
</div>

<div class="card" onclick="abrirTela('pptScreen')">
<i class="fas fa-file-powerpoint" style="color:#d24726"></i>
<span>PPT</span>
</div>

<div class="card" onclick="abrirTela('txtScreen')">
<i class="fas fa-file-lines" style="color:#9ca3af"></i>
<span>TXT</span>
</div>

<!-- ========= WORD ========= -->

<div id="wordScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">
← Voltar
</button>

<input
class="input"
id="tituloWord"
placeholder="Título do documento Word"
/>

<textarea
class="textarea"
id="textoWord"
placeholder="Digite o conteúdo..."
></textarea>

<button class="generate-btn" onclick="gerarWord()">
Gerar Word
</button>

<div id="previewWord"></div>

</div>

<!-- ========= EXCEL ========= -->

<div id="excelScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">
← Voltar
</button>

<textarea
class="textarea"
id="textoExcel"
placeholder="Digite valores separados por vírgula

Exemplo:
Nome,Idade,Cidade
João,22,SP"
></textarea>

<button class="generate-btn" onclick="gerarExcel()">
Gerar Excel
</button>

<div id="previewExcel"></div>

</div>

<!-- ========= PPT ========= -->

<div id="pptScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">
← Voltar
</button>

<input
class="input"
id="tituloPPT"
placeholder="Título"
/>

<textarea
class="textarea"
id="textoPPT"
placeholder="Conteúdo da apresentação..."
></textarea>

<button class="generate-btn" onclick="gerarPPT()">
Gerar PPT
</button>

<div id="previewPPT"></div>

</div>

<!-- ========= TXT ========= -->

<div id="txtScreen" class="screen hidden">

<button class="back-btn" onclick="voltar()">
← Voltar
</button>

<textarea
class="textarea"
id="textoTXT"
placeholder="Digite qualquer texto..."
></textarea>

<button class="generate-btn" onclick="gerarTXT()">
Gerar TXT
</button>

<div id="previewTXT"></div>

</div>
