<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI | Master V18</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #4f46e5; --bg: #070b14; --card: #111827; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #f9fafb; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        #app-content { display: none; width: 100%; max-width: 650px; padding: 20px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .main-card { background: var(--card); padding: 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        
        .user-header { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; background: rgba(255,255,255,0.03); padding: 10px 20px; border-radius: 50px; width: fit-content; }
        .user-header img { width: 35px; border-radius: 50%; border: 2px solid var(--primary); }

        textarea { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 20px; color: white; padding: 20px; font-size: 16px; min-height: 250px; resize: none; margin-bottom: 20px; outline: none; transition: 0.3s; }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        .action-zone { display: grid; grid-template-columns: 1fr; gap: 15px; }
        
        .btn-ai { background: linear-gradient(135deg, var(--primary), #9333ea); color: white; border: none; padding: 20px; border-radius: 20px; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; }
        
        .download-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .btn-down { background: #1e293b; color: white; border: 1px solid #334155; padding: 15px; border-radius: 15px; cursor: pointer; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-down:hover { background: #334155; transform: translateY(-3px); }
        .btn-down i { font-size: 18px; }

        .loader { display: none; text-align: center; color: var(--primary); font-weight: 700; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="login-gate" style="text-align:center;">
        <div class="main-card" style="max-width: 400px;">
            <i class="fas fa-microchip" style="font-size: 40px; color: var(--primary); margin-bottom: 20px;"></i>
            <h1>Elite Docs AI</h1>
            <p style="color: #94a3b8; margin-bottom: 30px;">Identifique-se para iniciar o processamento.</p>
            <div id="g_id_onload" data-client_id="593110663863-u9956693jafabtisfm0jnbgsufjd8n1f.apps.googleusercontent.com" data-callback="handleLogin"></div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue" data-size="large"></div>
        </div>
    </div>

    <div id="app-content">
        <div class="main-card">
            <div class="user-header">
                <img id="uPic" src=""><span id="uName"></span>
            </div>

            <textarea id="mainInput" placeholder="Ex: Sou arquiteto com 10 anos de experiência especializado em BIM..."></textarea>
            
            <div id="aiLoader" class="loader"><i class="fas fa-sparkles fa-spin"></i> IA ELITE REFINANDO O SEU PERFIL...</div>

            <div class="action-zone">
                <button class="btn-ai" onclick="runEliteAI()">
                    <i class="fas fa-wand-magic-sparkles"></i> REFINAR COM INTELIGÊNCIA ELITE
                </button>
                
                <div style="margin-top: 15px;">
                    <p style="font-size: 11px; color: var(--primary); font-weight: 800; margin-bottom: 10px; text-transform: uppercase;">Baixar separadamente:</p>
                    <div class="download-row">
                        <button class="btn-down" onclick="exportPDF()"><i class="fas fa-file-pdf" style="color:#ef4444"></i>PDF</button>
                        <button class="btn-down" onclick="exportWord()"><i class="fas fa-file-word" style="color:#3b82f6"></i>WORD</button>
                        <button class="btn-down" onclick="exportExcel()"><i class="fas fa-file-excel" style="color:#10b981"></i>EXCEL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(response) {
            const user = JSON.parse(atob(response.credential.split('.')[1]));
            document.getElementById('login-gate').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('uPic').src = user.picture;
            document.getElementById('uName').innerText = user.name.toUpperCase();
        }

        async function runEliteAI() {
            const input = document.getElementById('mainInput');
            const loader = document.getElementById('aiLoader');
            if(!input.value) return alert("Por favor, introduza o seu texto profissional.");

            loader.style.display = "block";
            const original = input.value;
            
            try {
                // PROMPT REFINADO: Agora ele cria um documento de verdade, não apenas uma frase.
                const prompt = `Aja como um consultor de carreira sênior. Transforme o rascunho abaixo em um perfil profissional de elite, detalhado, formal e impactante em português: ${original}`;
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                input.value = await res.text();
            } catch (e) {
                alert("Erro ao conectar com a IA.");
                input.value = original;
            } finally {
                loader.style.display = "none";
            }
        }

        function exportPDF() {
            const content = document.getElementById('mainInput').value;
            const element = document.createElement('div');
            element.style.padding = "50px";
            element.innerHTML = `<h1 style="color:#4f46e5; border-bottom: 2px solid #4f46e5; padding-bottom: 10px;">Perfil Profissional Elite</h1><p style="white-space:pre-line; line-height:1.6; font-size:14px;">${content}</p>`;
            html2pdf().from(element).save('Perfil_Elite.pdf');
        }

        function exportWord() {
            const content = document.getElementById('mainInput').value;
            const blob = new Blob(['\ufeff', `<h1>Perfil Profissional</h1><p>${content.replace(/\n/g, '<br>')}</p>`], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Perfil_Elite.doc';
            link.click();
        }

        function exportExcel() {
            const content = document.getElementById('mainInput').value;
            const rows = content.split('\n').filter(l => l.trim() !== "").map(line => [line]);
            const ws = XLSX.utils.aoa_to_sheet([["CONTEÚDO PROFISSIONAL REFINADO"], ...rows]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Perfil");
            XLSX.writeFile(wb, "Perfil_Elite.xlsx");
        }
    </script>
</body>
</html>
