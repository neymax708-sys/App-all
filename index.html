<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Docs AI</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>
        body { font-family: sans-serif; background: #050510; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .btn-google { background: white; color: black; padding: 15px 25px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginArea">
        <h1>Elite Docs AI</h1>
        <p style="margin-bottom: 20px;">Entre para continuar</p>
        <button class="btn-google" onclick="loginGoogle()">Entrar com Google</button>
    </div>

    <div id="dashboard" class="hidden">
        <h1 id="welcomeText"></h1>
        <button onclick="logout()" style="background: none; border: 1px solid red; color: red; padding: 10px; cursor: pointer; margin-top: 20px;">Sair</button>
    </div>
</div>

<script>
    // Configurações do seu projeto
    const firebaseConfig = {
        apiKey: "AIzaSyDFPrrCSowCuo3QJ6T280zja2Wqutlccvo", // Chave corrigida da imagem
        authDomain: "elite-docsai.firebaseapp.com",
        projectId: "elite-docsai",
        storageBucket: "elite-docsai.appspot.com",
        messagingSenderId: "1048692395624",
        appId: "1:1048692395624:web:74fb23e57580b9203ab5dd",
        measurementId: "G-G63HC1V4FD"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);

    // Função de Login
    function loginGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        // Força a escolha da conta
        provider.setCustomParameters({ prompt: 'select_account' });
        // Redireciona para evitar bloqueio de popup
        firebase.auth().signInWithRedirect(provider);
    }

    // Monitorar se o usuário está logado
    firebase.auth().onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('loginArea').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('welcomeText').innerText = "Bem-vindo, " + user.displayName;
        } else {
            document.getElementById('loginArea').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }
    });

    function logout() {
        firebase.auth().signOut();
    }
</script>

</body>
</html>
